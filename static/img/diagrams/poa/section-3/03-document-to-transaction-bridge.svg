<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" fill="none" role="img" aria-label="Five-Step Bridge Translating Source Documents into Transaction Descriptions">
  <rect width="820" height="410" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="382" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Decoding Source Documents into Clear Transaction Descriptions</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">HOW TO READ ANY PAPER DOCUMENT FROM YOUR BUSINESS’S POINT OF VIEW</text>

  <!-- Step 1 -->
  <rect x="34" y="92" width="136" height="106" rx="9" fill="#122440" stroke="#6BC4B0" stroke-width="1.6"/>
  <rect x="34" y="92" width="136" height="24" rx="9" fill="#4E8577"/>
  <text x="102" y="108" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">1. PERSPECTIVE</text>
  <text x="102" y="136" text-anchor="middle" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Who Are WE?</text>
  <text x="102" y="156" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10">Top letterhead = Seller</text>
  <text x="102" y="172" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10">“To:” line = Buyer</text>

  <path d="M174 145 H192" stroke="#F5A352" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M187 139 L195 145 L187 151" fill="none" stroke="#F5A352" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 -->
  <rect x="198" y="92" width="136" height="106" rx="9" fill="#122440" stroke="#6BC4B0" stroke-width="1.6"/>
  <rect x="198" y="92" width="136" height="24" rx="9" fill="#4E8577"/>
  <text x="266" y="108" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">2. DOC TYPE</text>
  <text x="266" y="136" text-anchor="middle" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">What Happened?</text>
  <text x="266" y="156" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10">Invoice = Credit trade</text>
  <text x="266" y="172" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10">Credit Note = Return</text>
  <text x="266" y="186" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10">Receipt = Cash paid</text>

  <path d="M338 145 H356" stroke="#F5A352" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M351 139 L359 145 L351 151" fill="none" stroke="#F5A352" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 -->
  <rect x="362" y="92" width="136" height="106" rx="9" fill="#122440" stroke="#6BC4B0" stroke-width="1.6"/>
  <rect x="362" y="92" width="136" height="24" rx="9" fill="#2E6359"/>
  <text x="430" y="108" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">3. ITEM TYPE</text>
  <text x="430" y="136" text-anchor="middle" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Goods or Asset?</text>
  <text x="430" y="156" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10">Resale inventory vs.</text>
  <text x="430" y="172" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10">equipment / expense</text>

  <path d="M502 145 H520" stroke="#F5A352" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M515 139 L523 145 L515 151" fill="none" stroke="#F5A352" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 4 -->
  <rect x="526" y="92" width="136" height="106" rx="9" fill="#122440" stroke="#F5A352" stroke-width="1.6"/>
  <rect x="526" y="92" width="136" height="24" rx="9" fill="#C84E24"/>
  <text x="594" y="108" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">4. NET VALUE</text>
  <text x="594" y="136" text-anchor="middle" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Check Net Total</text>
  <text x="594" y="156" text-anchor="middle" fill="#FDEFDF" font-family="system-ui, sans-serif" font-size="10">Always use total</text>
  <text x="594" y="172" text-anchor="middle" fill="#FDEFDF" font-family="system-ui, sans-serif" font-size="10">AFTER trade discount!</text>

  <path d="M666 145 H684" stroke="#F5A352" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M679 139 L687 145 L679 151" fill="none" stroke="#F5A352" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 5 -->
  <rect x="690" y="92" width="96" height="106" rx="9" fill="#F5A352"/>
  <text x="738" y="128" text-anchor="middle" fill="#122440" font-family="monospace" font-size="10" font-weight="800">5. WRITE</text>
  <text x="738" y="148" text-anchor="middle" fill="#122440" font-family="system-ui, sans-serif" font-size="12" font-weight="800">CLEAR</text>
  <text x="738" y="164" text-anchor="middle" fill="#122440" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">SENTENCE</text>
  <text x="738" y="182" text-anchor="middle" fill="#122440" font-family="system-ui, sans-serif" font-size="9.5">&amp; Pick Book</text>

  <!-- Live Translation Example Box -->
  <rect x="34" y="220" width="752" height="158" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.5"/>
  <text x="52" y="246" fill="#F5A352" font-family="monospace" font-size="11" font-weight="700">EXAMPLE: ONE CREDIT NOTE READ FROM TWO DIFFERENT PERSPECTIVES</text>

  <rect x="52" y="260" width="716" height="32" rx="6" fill="#1B365D"/>
  <text x="66" y="280" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11.5"><tspan font-weight="700" fill="#9DD9CB">Document:</tspan> Credit Note #CN-19 issued by <tspan font-weight="700">Metro Fabrics</tspan> to <tspan font-weight="700">StyleWear Boutique</tspan> for $240 damaged cloth (14 June).</text>

  <rect x="52" y="302" width="350" height="62" rx="8" fill="#132F34" stroke="#6BC4B0" stroke-width="1.2"/>
  <text x="66" y="320" fill="#6BC4B0" font-family="monospace" font-size="10" font-weight="700">IN METRO FABRICS’ BOOKS (SELLER)</text>
  <text x="66" y="338" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11">“StyleWear Boutique returned $240 of goods to us.”</text>
  <text x="66" y="354" fill="#9DD9CB" font-family="monospace" font-size="9.5">→ Record in Returns Inwards Journal</text>

  <rect x="418" y="302" width="350" height="62" rx="8" fill="#2A1D24" stroke="#F5A352" stroke-width="1.2"/>
  <text x="432" y="320" fill="#F5A352" font-family="monospace" font-size="10" font-weight="700">IN STYLEWEAR BOUTIQUE’S BOOKS (BUYER)</text>
  <text x="432" y="338" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11">“Returned $240 of damaged goods to Metro Fabrics.”</text>
  <text x="432" y="354" fill="#F5A352" font-family="monospace" font-size="9.5">→ Record in Returns Outwards Journal</text>
</svg>
