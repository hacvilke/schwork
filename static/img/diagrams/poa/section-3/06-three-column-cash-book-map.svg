<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" fill="none" role="img" aria-label="Layout of a Three-Column Cash Book Showing Receipts, Payments, Contra Entries, and Balancing">
  <rect width="820" height="420" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="392" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Anatomy of a Three-Column Cash Book</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">RECEIPTS ON DEBIT (LEFT)  ·  PAYMENTS ON CREDIT (RIGHT)  ·  CONTRA ENTRIES MARKED (C)</text>

  <!-- Cash Book T-Table Frame -->
  <rect x="30" y="88" width="760" height="222" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>

  <!-- Top side banners -->
  <rect x="30" y="88" width="380" height="28" rx="9" fill="#4E8577"/>
  <text x="220" y="106" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="800">Dr · RECEIPTS (MONEY COMING IN)</text>

  <rect x="410" y="88" width="380" height="28" rx="9" fill="#C84E24"/>
  <text x="600" y="106" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="800">Cr · PAYMENTS (MONEY GOING OUT)</text>

  <!-- Center T divider -->
  <line x1="410" y1="88" x2="410" y2="310" stroke="#F5A352" stroke-width="2.4"/>

  <!-- Column headers -->
  <g font-family="monospace" font-size="9.5" font-weight="700">
    <text x="40" y="132" fill="#9DD9CB">Date  Details         F   DiscA  Cash   Bank</text>
    <text x="420" y="132" fill="#F5A352">Date  Details         F   DiscR  Cash   Bank</text>
  </g>
  <line x1="34" y1="140" x2="786" y2="140" stroke="#2D507C"/>

  <!-- Sample rows -->
  <g font-family="monospace" font-size="9.5" fill="#DCE8F2">
    <text x="40" y="158">Jun 1 Balance b/d            —    500  2,400</text>
    <text x="40" y="177">Jun 4 Sales                  —    900      —</text>
    <text x="40" y="196">Jun 9 R. Ali                50      —    950</text>
    <text x="40" y="215" fill="#F5A352" font-weight="700">Jun15 Cash (Banked)   C      —      —    600</text>

    <text x="420" y="158">Jun 5 Rent                   —      —    700</text>
    <text x="420" y="177">Jun10 Star Supply           30      —    570</text>
    <text x="420" y="196" fill="#F5A352" font-weight="700">Jun15 Bank (Banked)   C      —    600      —</text>
    <text x="420" y="215" fill="#6BC4B0" font-weight="700">Jun30 Balance c/d            —    800  2,680</text>
  </g>

  <!-- Totals line -->
  <line x1="34" y1="228" x2="786" y2="228" stroke="#6BC4B0"/>
  <g font-family="monospace" font-size="9.5" font-weight="700">
    <text x="40" y="246" fill="#FFFFFF">      TOTALS                50  1,400  3,950</text>
    <text x="420" y="246" fill="#FFFFFF">      TOTALS                30  1,400  3,950</text>
  </g>
  <line x1="34" y1="254" x2="786" y2="254" stroke="#6BC4B0"/>
  <line x1="34" y1="258" x2="786" y2="258" stroke="#6BC4B0"/>

  <!-- Balance b/d next month -->
  <text x="40" y="280" fill="#6BC4B0" font-family="monospace" font-size="10" font-weight="700">Jul 1 Balance b/d            —    800  2,680</text>
  <text x="420" y="280" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10">Discount columns are TOTALED ONLY — NEVER balanced!</text>
  <text x="420" y="296" fill="#9DD9CB" font-family="monospace" font-size="9.5">Dr Disc Allowed ($50) · Cr Disc Received ($30)</text>

  <!-- Bottom 3 Rule Callouts -->
  <rect x="30" y="328" width="242" height="64" rx="8" fill="#122440" stroke="#F5A352" stroke-width="1.3"/>
  <text x="44" y="347" fill="#F5A352" font-family="monospace" font-size="10" font-weight="700">CONTRA ENTRY (C)</text>
  <text x="44" y="365" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="10.5">Cash banked or cash withdrawn from</text>
  <text x="44" y="380" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="10.5">bank hits BOTH sides inside Cash Book.</text>

  <rect x="289" y="328" width="242" height="64" rx="8" fill="#122440" stroke="#6BC4B0" stroke-width="1.3"/>
  <text x="303" y="347" fill="#6BC4B0" font-family="monospace" font-size="10" font-weight="700">CASH COLUMN RULE</text>
  <text x="303" y="365" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="10.5">Physical cash can NEVER be negative;</text>
  <text x="303" y="380" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="10.5">Balance b/d is ALWAYS Debit (or $0).</text>

  <rect x="548" y="328" width="242" height="64" rx="8" fill="#122440" stroke="#8CC4B4" stroke-width="1.3"/>
  <text x="562" y="347" fill="#9DD9CB" font-family="monospace" font-size="10" font-weight="700">BANK COLUMN RULE</text>
  <text x="562" y="365" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="10.5">Debit b/d = Positive Bank Asset.</text>
  <text x="562" y="380" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="10.5">Credit b/d = Bank Overdraft (Liability)!</text>
</svg>
