<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" fill="none" role="img" aria-label="The Imprest Petty Cash System Cycle Diagram">
  <rect width="820" height="420" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="392" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">The Imprest Petty Cash System: Fixed Float Cycle</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">SPEND SMALL AMOUNTS WITH VOUCHERS → REIMBURSE EXACT AMOUNT SPENT → FLOAT RESTORED!</text>

  <!-- Visual Math Bar -->
  <rect x="34" y="88" width="752" height="66" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.6"/>
  <text x="52" y="109" fill="#9DD9CB" font-family="monospace" font-size="10.5" font-weight="700">EXAMPLE WITH $200 FIXED IMPREST FLOAT</text>

  <!-- Bar segments -->
  <rect x="52" y="118" width="460" height="24" rx="5" fill="#C84E24"/>
  <text x="282" y="134" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="800">VOUCHERS SPENT DURING MONTH: $145</text>

  <rect x="516" y="118" width="174" height="24" rx="5" fill="#4E8577"/>
  <text x="603" y="134" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="800">CASH LEFT c/d: $55</text>

  <text x="738" y="134" text-anchor="middle" fill="#F5A352" font-family="monospace" font-size="12" font-weight="800">= $200 ✓</text>

  <!-- 4-Step Loop -->
  <rect x="34" y="176" width="174" height="122" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.6"/>
  <rect x="34" y="176" width="174" height="24" rx="9" fill="#4E8577"/>
  <text x="121" y="192" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">1. SET FLOAT</text>
  <text x="121" y="220" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">$200 Float</text>
  <text x="121" y="242" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10.5">Chief cashier gives</text>
  <text x="121" y="257" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10.5">petty cashier fixed</text>
  <text x="121" y="272" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10.5">starting cash float.</text>

  <path d="M212 237 H228" stroke="#F5A352" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M223 231 L231 237 L223 243" fill="none" stroke="#F5A352" stroke-width="2.2" stroke-linecap="round"/>

  <rect x="234" y="176" width="174" height="122" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.6"/>
  <rect x="234" y="176" width="174" height="24" rx="9" fill="#4E8577"/>
  <text x="321" y="192" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">2. PAY &amp; LOG</text>
  <text x="321" y="220" text-anchor="middle" fill="#F5A352" font-family="system-ui, sans-serif" font-size="16" font-weight="800">−$145 Spent</text>
  <text x="321" y="242" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10.5">Record vouchers into</text>
  <text x="321" y="257" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10.5">analysis columns</text>
  <text x="321" y="272" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10.5">(Postage, Travel, etc.).</text>

  <path d="M412 237 H428" stroke="#F5A352" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M423 231 L431 237 L423 243" fill="none" stroke="#F5A352" stroke-width="2.2" stroke-linecap="round"/>

  <rect x="434" y="176" width="174" height="122" rx="10" fill="#122440" stroke="#8CC4B4" stroke-width="1.6"/>
  <rect x="434" y="176" width="174" height="24" rx="9" fill="#2E6359"/>
  <text x="521" y="192" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">3. BALANCE</text>
  <text x="521" y="220" text-anchor="middle" fill="#6BC4B0" font-family="system-ui, sans-serif" font-size="16" font-weight="800">$55 Bal. c/d</text>
  <text x="521" y="242" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10.5">Count cash box ($55)</text>
  <text x="521" y="257" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10.5">and verify $55 + $145</text>
  <text x="521" y="272" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10.5">= $200 Float!</text>

  <path d="M612 237 H628" stroke="#F5A352" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M623 231 L631 237 L623 243" fill="none" stroke="#F5A352" stroke-width="2.2" stroke-linecap="round"/>

  <rect x="634" y="176" width="152" height="122" rx="10" fill="#122440" stroke="#F5A352" stroke-width="2"/>
  <rect x="634" y="176" width="152" height="24" rx="9" fill="#C84E24"/>
  <text x="710" y="192" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">4. RESTORE</text>
  <text x="710" y="220" text-anchor="middle" fill="#F5A352" font-family="system-ui, sans-serif" font-size="16" font-weight="800">+$145 Top-Up</text>
  <text x="710" y="242" text-anchor="middle" fill="#FDEFDF" font-family="system-ui, sans-serif" font-size="10.5">Chief cashier pays</text>
  <text x="710" y="257" text-anchor="middle" fill="#FDEFDF" font-family="system-ui, sans-serif" font-size="10.5">exact amount spent:</text>
  <text x="710" y="274" text-anchor="middle" fill="#6BC4B0" font-family="monospace" font-size="10.5" font-weight="700">$55 + $145 = $200</text>

  <!-- Bottom Control Formula Box -->
  <rect x="34" y="320" width="752" height="72" rx="10" fill="#122440" stroke="#F5A352" stroke-width="1.4"/>
  <text x="52" y="344" fill="#F5A352" font-family="monospace" font-size="11" font-weight="700">WHY BUSINESSES LOVE THE IMPREST SYSTEM (INTERNAL CONTROL)</text>
  <text x="52" y="365" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11.5">• At ANY instant: <tspan fill="#6BC4B0" font-weight="700">Cash in Petty Cash Box + Signed Vouchers = Exact Imprest Float</tspan> (exposes theft immediately!).</text>
  <text x="52" y="382" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="11">• Keeps hundreds of $5 receipts out of the main Cash Book — only analysis column totals post to the General Ledger.</text>
</svg>
