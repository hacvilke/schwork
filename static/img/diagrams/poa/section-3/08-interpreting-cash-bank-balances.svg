<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" fill="none" role="img" aria-label="Guide to Interpreting Debit and Credit Balances Brought Down in Cash Books">
  <rect width="820" height="420" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="392" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Interpreting Cash Book Balances Brought Down (b/d)</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">ALWAYS READ THE “BALANCE b/d” SIDE (NOT “BALANCE c/d”) TO TELL ASSET VS. OVERDRAFT!</text>

  <!-- Card 1: Cash Debit b/d -->
  <rect x="34" y="92" width="238" height="218" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="34" y="92" width="238" height="36" rx="10" fill="#4E8577"/>
  <text x="153" y="114" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Cash Column · Dr b/d</text>

  <text x="153" y="152" text-anchor="middle" fill="#6BC4B0" font-family="monospace" font-size="12" font-weight="800">CURRENT ASSET</text>
  <text x="48" y="178" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11">• Meaning: Physical cash sitting</text>
  <text x="48" y="194" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11">  in the cash register / safe.</text>
  <text x="48" y="218" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11">• Can Cash have a Credit b/d?</text>
  <text x="48" y="236" fill="#F5A352" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">  NO! Never possible!</text>
  <text x="48" y="256" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10">  (You cannot pay out more cash</text>
  <text x="48" y="270" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10">  notes than you physically have.)</text>
  <text x="48" y="294" fill="#9DD9CB" font-family="monospace" font-size="9.5">Trial Balance: DEBIT column</text>

  <!-- Card 2: Bank Debit b/d -->
  <rect x="291" y="92" width="238" height="218" rx="10" fill="#122440" stroke="#8CC4B4" stroke-width="1.8"/>
  <rect x="291" y="92" width="238" height="36" rx="10" fill="#2E6359"/>
  <text x="410" y="114" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Bank Column · Dr b/d</text>

  <text x="410" y="152" text-anchor="middle" fill="#6BC4B0" font-family="monospace" font-size="12" font-weight="800">FAVOURABLE · ASSET</text>
  <text x="305" y="178" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11">• Meaning: Positive money in</text>
  <text x="305" y="194" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11">  the business bank account.</text>
  <text x="305" y="218" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11">• Why Dr b/d?</text>
  <text x="305" y="236" fill="#9DD9CB" font-family="system-ui, sans-serif" font-size="11">  Bank receipts exceeded bank</text>
  <text x="305" y="252" fill="#9DD9CB" font-family="system-ui, sans-serif" font-size="11">  payments (Dr &gt; Cr).</text>
  <text x="305" y="276" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10">  Balance Sheet: Current Asset</text>
  <text x="305" y="294" fill="#9DD9CB" font-family="monospace" font-size="9.5">Trial Balance: DEBIT column</text>

  <!-- Card 3: Bank Credit b/d -->
  <rect x="548" y="92" width="238" height="218" rx="10" fill="#122440" stroke="#F5A352" stroke-width="2"/>
  <rect x="548" y="92" width="238" height="36" rx="10" fill="#C84E24"/>
  <text x="667" y="114" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Bank Column · Cr b/d</text>

  <text x="667" y="152" text-anchor="middle" fill="#F5A352" font-family="monospace" font-size="12" font-weight="800">OVERDRAFT · LIABILITY</text>
  <text x="562" y="178" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11">• Meaning: Business paid out</text>
  <text x="562" y="194" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11">  more than deposited — owes bank!</text>
  <text x="562" y="218" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11">• Why Cr b/d?</text>
  <text x="562" y="236" fill="#F5A352" font-family="system-ui, sans-serif" font-size="11">  Bank payments exceeded bank</text>
  <text x="562" y="252" fill="#F5A352" font-family="system-ui, sans-serif" font-size="11">  receipts (Cr &gt; Dr).</text>
  <text x="562" y="276" fill="#FDEFDF" font-family="system-ui, sans-serif" font-size="10">  Balance Sheet: Current Liability</text>
  <text x="562" y="294" fill="#F5A352" font-family="monospace" font-size="9.5">Trial Balance: CREDIT column</text>

  <!-- Bottom Trap Warning -->
  <rect x="34" y="330" width="752" height="60" rx="9" fill="#122440" stroke="#F5A352" stroke-width="1.4"/>
  <text x="52" y="354" fill="#F5A352" font-family="monospace" font-size="11" font-weight="700">DON’T FALL FOR THE “c/d” VS. “b/d” TRAP!</text>
  <text x="52" y="376" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11.5">A Bank Overdraft has <tspan fill="#6BC4B0" font-weight="700">Balance c/d on the DEBIT side</tspan> to make totals equal — then flips to <tspan fill="#F5A352" font-weight="700">Balance b/d on the CREDIT side</tspan>!</text>
</svg>
