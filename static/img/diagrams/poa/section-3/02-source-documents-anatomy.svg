<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" fill="none" role="img" aria-label="Anatomy of Key Source Documents: Invoice, Credit Note, and Official Receipt">
  <rect width="820" height="430" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="402" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Anatomy of Essential Business Source Documents</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">EVERY VALID ACCOUNTING ENTRY STARTS WITH VERIFIABLE DOCUMENT PROOF</text>

  <!-- Left Mock Invoice -->
  <rect x="34" y="88" width="380" height="308" rx="10" fill="#FCFBF8" stroke="#6BC4B0" stroke-width="2"/>
  <rect x="34" y="88" width="380" height="46" rx="10" fill="#122440"/>
  <text x="52" y="108" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">APEX WHOLESALE LTD.</text>
  <text x="52" y="124" fill="#9DD9CB" font-family="monospace" font-size="9.5">SELLER (ISSUER) · 14 HARBOUR RD</text>
  <rect x="310" y="99" width="90" height="24" rx="5" fill="#C84E24"/>
  <text x="355" y="115" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10.5" font-weight="800">INVOICE</text>

  <g font-family="system-ui, sans-serif" fill="#222222">
    <text x="52" y="154" font-size="10.5" font-weight="700">To (Buyer): <tspan font-weight="400">Sunrise Grocery</tspan></text>
    <text x="275" y="154" font-size="10.5" font-weight="700">Inv #: <tspan font-weight="400" fill="#C84E24">INV-1042</tspan></text>
    <text x="52" y="170" font-size="10.5" font-weight="700">Terms: <tspan font-weight="400">2/10, Net 30</tspan></text>
    <text x="275" y="170" font-size="10.5" font-weight="700">Date: <tspan font-weight="400">12 May 2026</tspan></text>

    <!-- Table header -->
    <rect x="48" y="184" width="352" height="22" rx="4" fill="#EBF2EF"/>
    <text x="56" y="199" font-size="10" font-weight="700" fill="#1B365D">Qty</text>
    <text x="92" y="199" font-size="10" font-weight="700" fill="#1B365D">Description</text>
    <text x="272" y="199" font-size="10" font-weight="700" fill="#1B365D">Unit $</text>
    <text x="342" y="199" font-size="10" font-weight="700" fill="#1B365D">Total $</text>

    <!-- Line items -->
    <text x="58" y="222" font-size="10.5">20</text>
    <text x="92" y="222" font-size="10.5">Cases Bottled Juice</text>
    <text x="275" y="222" font-size="10.5">40.00</text>
    <text x="344" y="222" font-size="10.5">800.00</text>

    <text x="58" y="242" font-size="10.5">10</text>
    <text x="92" y="242" font-size="10.5">Boxes Oats Cereal</text>
    <text x="275" y="242" font-size="10.5">20.00</text>
    <text x="344" y="242" font-size="10.5">200.00</text>

    <line x1="48" y1="256" x2="400" y2="256" stroke="#CEDCD6"/>
    <text x="220" y="274" font-size="10.5" font-weight="600">Gross List Price:</text>
    <text x="336" y="274" font-size="10.5">1,000.00</text>

    <text x="220" y="294" font-size="10.5" font-weight="700" fill="#2E6359">Less 10% Trade Disc:</text>
    <text x="340" y="294" font-size="10.5" font-weight="700" fill="#2E6359">(100.00)</text>

    <rect x="212" y="306" width="188" height="28" rx="5" fill="#1B365D"/>
    <text x="222" y="324" font-size="11" font-weight="800" fill="#FFFFFF">NET AMOUNT DUE:</text>
    <text x="344" y="324" font-size="11.5" font-weight="800" fill="#F5A352">$900.00</text>

    <text x="52" y="360" font-size="9.5" fill="#4A5560" font-style="italic">E. &amp; O.E. (Errors and Omissions Excepted)</text>
    <text x="52" y="378" font-size="9.5" font-weight="700" fill="#1B365D">Seller → Sales Journal ($900)  |  Buyer → Purchases Journal ($900)</text>
  </g>

  <!-- Right Column: 3 Other Key Source Documents -->
  <rect x="434" y="88" width="352" height="94" rx="10" fill="#122440" stroke="#F5A352" stroke-width="1.6"/>
  <rect x="434" y="88" width="128" height="24" rx="8" fill="#C84E24"/>
  <text x="498" y="104" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">CREDIT NOTE</text>
  <text x="574" y="104" fill="#F5A352" font-family="monospace" font-size="9.5">ISSUED BY SELLER</text>
  <text x="450" y="132" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Reduces what the buyer owes!</text>
  <text x="450" y="150" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10.5">Used for returned damaged goods or overcharges.</text>
  <text x="450" y="168" fill="#9DD9CB" font-family="monospace" font-size="9.5">Seller: Returns Inwards · Buyer: Returns Outwards</text>

  <rect x="434" y="194" width="352" height="94" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.6"/>
  <rect x="434" y="194" width="128" height="24" rx="8" fill="#4E8577"/>
  <text x="498" y="210" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">OFFICIAL RECEIPT</text>
  <text x="574" y="210" fill="#9DD9CB" font-family="monospace" font-size="9.5">PROOF OF PAYMENT</text>
  <text x="450" y="238" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Confirms immediate cash/cheque payment</text>
  <text x="450" y="256" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10.5">Shows Receipt #, payer name, amount in words &amp; figures.</text>
  <text x="450" y="274" fill="#9DD9CB" font-family="monospace" font-size="9.5">Receiver: Cash Book (Dr) · Payer: Cash Book (Cr)</text>

  <rect x="434" y="300" width="352" height="96" rx="10" fill="#122440" stroke="#8CC4B4" stroke-width="1.6"/>
  <rect x="434" y="300" width="128" height="24" rx="8" fill="#2E6359"/>
  <text x="498" y="316" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">DEBIT NOTE &amp; VOUCHERS</text>
  <text x="450" y="344" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11">• <tspan font-weight="700" fill="#F5A352">Debit Note:</tspan> Buyer requests reduction OR seller fixes undercharge</text>
  <text x="450" y="363" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11">• <tspan font-weight="700" fill="#6BC4B0">Petty Cash Voucher:</tspan> Signed slip for minor cash expenses</text>
  <text x="450" y="382" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11">• <tspan font-weight="700" fill="#9DD9CB">Cheque Counterfoil / Bank Slip:</tspan> Bank payments &amp; deposits</text>
</svg>
