<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" fill="none" role="img" aria-label="The Accounting Process Pipeline and Six Core Purposes of Accounting">
  <rect width="820" height="420" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="392" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">The Accounting Information Pipeline &amp; Core Purposes</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">HOW RAW TRANSACTIONS BECOME USEFUL FINANCIAL DECISIONS</text>

  <!-- Pipeline Stage Boxes (4 steps + output) -->
  <!-- Step 1 -->
  <rect x="34" y="92" width="136" height="84" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="34" y="92" width="136" height="24" rx="10" fill="#4E8577"/>
  <text x="102" y="108" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">1. RECORD</text>
  <text x="102" y="136" text-anchor="middle" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Capture Events</text>
  <text x="102" y="155" text-anchor="middle" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10.5">Invoices, receipts</text>
  <text x="102" y="168" text-anchor="middle" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10.5">&amp; journals</text>

  <!-- Arrow 1->2 -->
  <path d="M174 134 H194" stroke="#F5A352" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M189 128 L197 134 L189 140" fill="none" stroke="#F5A352" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 -->
  <rect x="200" y="92" width="136" height="84" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="200" y="92" width="136" height="24" rx="10" fill="#4E8577"/>
  <text x="268" y="108" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">2. CLASSIFY</text>
  <text x="268" y="136" text-anchor="middle" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Sort by Account</text>
  <text x="268" y="155" text-anchor="middle" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10.5">Assets, liabilities,</text>
  <text x="268" y="168" text-anchor="middle" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10.5">income &amp; expenses</text>

  <!-- Arrow 2->3 -->
  <path d="M340 134 H360" stroke="#F5A352" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M355 128 L363 134 L355 140" fill="none" stroke="#F5A352" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 -->
  <rect x="366" y="92" width="136" height="84" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="366" y="92" width="136" height="24" rx="10" fill="#4E8577"/>
  <text x="434" y="108" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">3. SUMMARIZE</text>
  <text x="434" y="136" text-anchor="middle" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Build Reports</text>
  <text x="434" y="155" text-anchor="middle" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10.5">Trial Balance,</text>
  <text x="434" y="168" text-anchor="middle" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10.5">Income &amp; Balance Sheet</text>

  <!-- Arrow 3->4 -->
  <path d="M506 134 H526" stroke="#F5A352" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M521 128 L529 134 L521 140" fill="none" stroke="#F5A352" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 4 -->
  <rect x="532" y="92" width="136" height="84" rx="10" fill="#122440" stroke="#F5A352" stroke-width="2"/>
  <rect x="532" y="92" width="136" height="24" rx="10" fill="#C84E24"/>
  <text x="600" y="108" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">4. INTERPRET</text>
  <text x="600" y="136" text-anchor="middle" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Analyze Meaning</text>
  <text x="600" y="155" text-anchor="middle" fill="#FDEFDF" font-family="system-ui, sans-serif" font-size="10.5">Ratios, trends &amp;</text>
  <text x="600" y="168" text-anchor="middle" fill="#FDEFDF" font-family="system-ui, sans-serif" font-size="10.5">decisions</text>

  <!-- Output pill -->
  <path d="M672 134 H690" stroke="#F5A352" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M685 128 L693 134 L685 140" fill="none" stroke="#F5A352" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="696" y="102" width="90" height="64" rx="10" fill="#F5A352"/>
  <text x="741" y="130" text-anchor="middle" fill="#122440" font-family="system-ui, sans-serif" font-size="12" font-weight="800">SMART</text>
  <text x="741" y="147" text-anchor="middle" fill="#122440" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">DECISIONS</text>

  <!-- Bracket showing Bookkeeping vs Accounting -->
  <path d="M38 190 V198 H332 V190" stroke="#9DD9CB" stroke-width="1.6"/>
  <text x="185" y="214" text-anchor="middle" fill="#9DD9CB" font-family="monospace" font-size="11" font-weight="700">BOOKKEEPING (Daily Recording &amp; Posting)</text>
  <path d="M38 222 V230 H664 V222" stroke="#F5A352" stroke-width="1.6"/>
  <text x="351" y="246" text-anchor="middle" fill="#F5A352" font-family="monospace" font-size="11" font-weight="700">FULL ACCOUNTING SCOPE (Recording + Summarizing + Interpreting)</text>

  <!-- Divider -->
  <line x1="34" y1="264" x2="786" y2="264" stroke="#2D507C" stroke-width="1.2"/>
  <text x="34" y="286" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Six Core Purposes of Accounting</text>

  <!-- 6 Purpose Pills (2 rows x 3 cols) -->
  <g font-family="system-ui, sans-serif">
    <rect x="34" y="300" width="238" height="40" rx="8" fill="#122440" stroke="#4E8577" stroke-width="1.3"/>
    <text x="48" y="317" fill="#6BC4B0" font-size="11.5" font-weight="700">1. Record Keeping</text>
    <text x="48" y="332" fill="#BFD4E4" font-size="10">Complete history &amp; audit trail</text>

    <rect x="291" y="300" width="238" height="40" rx="8" fill="#122440" stroke="#4E8577" stroke-width="1.3"/>
    <text x="305" y="317" fill="#6BC4B0" font-size="11.5" font-weight="700">2. Financial Reporting</text>
    <text x="305" y="332" fill="#BFD4E4" font-size="10">Profit, assets, liabilities &amp; cash flow</text>

    <rect x="548" y="300" width="238" height="40" rx="8" fill="#122440" stroke="#4E8577" stroke-width="1.3"/>
    <text x="562" y="317" fill="#6BC4B0" font-size="11.5" font-weight="700">3. Decision Making</text>
    <text x="562" y="332" fill="#BFD4E4" font-size="10">Pricing, budgeting &amp; expansion</text>

    <rect x="34" y="350" width="238" height="40" rx="8" fill="#122440" stroke="#4E8577" stroke-width="1.3"/>
    <text x="48" y="367" fill="#F5A352" font-size="11.5" font-weight="700">4. Performance Evaluation</text>
    <text x="48" y="382" fill="#BFD4E4" font-size="10">Profitability &amp; efficiency ratios</text>

    <rect x="291" y="350" width="238" height="40" rx="8" fill="#122440" stroke="#4E8577" stroke-width="1.3"/>
    <text x="305" y="367" fill="#F5A352" font-size="11.5" font-weight="700">5. Control &amp; Asset Protection</text>
    <text x="305" y="382" fill="#BFD4E4" font-size="10">Prevent errors, theft &amp; waste</text>

    <rect x="548" y="350" width="238" height="40" rx="8" fill="#122440" stroke="#4E8577" stroke-width="1.3"/>
    <text x="562" y="367" fill="#F5A352" font-size="11.5" font-weight="700">6. Legal &amp; Tax Compliance</text>
    <text x="562" y="382" fill="#BFD4E4" font-size="10">Accurate tax returns &amp; statutory filings</text>
  </g>
</svg>
