<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" fill="none" role="img" aria-label="Internal vs External Users of Accounting Information">
  <rect width="820" height="420" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="392" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Internal vs. External Users of Accounting Information</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">WHO READS THE FINANCIAL STATEMENTS — AND WHAT DECISIONS THEY MAKE</text>

  <!-- Left Column: Internal Users -->
  <rect x="34" y="88" width="272" height="300" rx="12" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="34" y="88" width="272" height="34" rx="12" fill="#4E8577"/>
  <text x="170" y="110" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">INTERNAL USERS (Inside Business)</text>

  <g font-family="system-ui, sans-serif">
    <rect x="50" y="138" width="240" height="66" rx="8" fill="#1B365D" stroke="#4E8577" stroke-width="1.2"/>
    <text x="64" y="159" fill="#9DD9CB" font-size="12.5" font-weight="700">Owners / Proprietors</text>
    <text x="64" y="177" fill="#E2EDF5" font-size="10.5">Checks profit, return on capital,</text>
    <text x="64" y="192" fill="#E2EDF5" font-size="10.5">&amp; whether to invest or expand.</text>

    <rect x="50" y="218" width="240" height="66" rx="8" fill="#1B365D" stroke="#4E8577" stroke-width="1.2"/>
    <text x="64" y="239" fill="#9DD9CB" font-size="12.5" font-weight="700">Managers &amp; Directors</text>
    <text x="64" y="257" fill="#E2EDF5" font-size="10.5">Plans budgets, controls costs,</text>
    <text x="64" y="272" fill="#E2EDF5" font-size="10.5">&amp; guides day-to-day operations.</text>

    <rect x="50" y="298" width="240" height="66" rx="8" fill="#1B365D" stroke="#4E8577" stroke-width="1.2"/>
    <text x="64" y="319" fill="#9DD9CB" font-size="12.5" font-weight="700">Employees &amp; Trade Unions</text>
    <text x="64" y="337" fill="#E2EDF5" font-size="10.5">Assesses job security, bonuses,</text>
    <text x="64" y="352" fill="#E2EDF5" font-size="10.5">&amp; fair wage negotiations.</text>
  </g>

  <!-- Center Hub -->
  <line x1="306" y1="238" x2="344" y2="238" stroke="#6BC4B0" stroke-width="2.4"/>
  <line x1="476" y1="238" x2="514" y2="238" stroke="#F5A352" stroke-width="2.4"/>
  <rect x="344" y="174" width="132" height="128" rx="14" fill="#122440" stroke="#F5A352" stroke-width="2.2"/>
  <text x="410" y="214" text-anchor="middle" fill="#F5A352" font-family="monospace" font-size="11" font-weight="700">FINANCIAL</text>
  <text x="410" y="234" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800">REPORTS</text>
  <text x="410" y="256" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10">Income Statement</text>
  <text x="410" y="271" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10">Balance Sheet</text>
  <text x="410" y="286" text-anchor="middle" fill="#BFD4E4" font-family="system-ui, sans-serif" font-size="10">Cash Flow</text>

  <!-- Right Column: External Users -->
  <rect x="514" y="88" width="272" height="300" rx="12" fill="#122440" stroke="#F5A352" stroke-width="1.8"/>
  <rect x="514" y="88" width="272" height="34" rx="12" fill="#C84E24"/>
  <text x="650" y="110" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">EXTERNAL USERS (Outside Business)</text>

  <g font-family="system-ui, sans-serif">
    <rect x="530" y="136" width="240" height="44" rx="7" fill="#1B365D" stroke="#D97736" stroke-width="1.1"/>
    <text x="542" y="154" fill="#F5A352" font-size="11.5" font-weight="700">Investors / Shareholders</text>
    <text x="542" y="170" fill="#E2EDF5" font-size="10">Buy, hold, or sell shares &amp; dividends</text>

    <rect x="530" y="188" width="240" height="44" rx="7" fill="#1B365D" stroke="#D97736" stroke-width="1.1"/>
    <text x="542" y="206" fill="#F5A352" font-size="11.5" font-weight="700">Banks &amp; Lenders (Creditors)</text>
    <text x="542" y="222" fill="#E2EDF5" font-size="10">Liquidity, collateral &amp; loan repayment</text>

    <rect x="530" y="240" width="240" height="44" rx="7" fill="#1B365D" stroke="#D97736" stroke-width="1.1"/>
    <text x="542" y="258" fill="#F5A352" font-size="11.5" font-weight="700">Suppliers (Trade Payables)</text>
    <text x="542" y="274" fill="#E2EDF5" font-size="10">Can the firm pay invoices on time?</text>

    <rect x="530" y="292" width="240" height="44" rx="7" fill="#1B365D" stroke="#D97736" stroke-width="1.1"/>
    <text x="542" y="310" fill="#F5A352" font-size="11.5" font-weight="700">Government &amp; Tax Authorities</text>
    <text x="542" y="326" fill="#E2EDF5" font-size="10">Tax assessment &amp; legal compliance</text>

    <rect x="530" y="344" width="240" height="34" rx="7" fill="#1B365D" stroke="#D97736" stroke-width="1.1"/>
    <text x="542" y="365" fill="#F5A352" font-size="11" font-weight="700">Customers &amp; Analysts:</text>
    <text x="665" y="365" fill="#E2EDF5" font-size="10">Continuity &amp; advice</text>
  </g>
</svg>
