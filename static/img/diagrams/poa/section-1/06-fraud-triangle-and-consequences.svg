<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" fill="none" role="img" aria-label="The Fraud Triangle and Ripple Consequences of Unethical Accounting Behavior">
  <rect width="820" height="420" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="392" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">The Fraud Triangle &amp; Ripple Consequences of Unethical Behavior</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">WHY FRAUD HAPPENS AND HOW IT HARMS INDIVIDUALS, FIRMS &amp; SOCIETY</text>

  <!-- Left: Fraud Triangle -->
  <rect x="34" y="88" width="330" height="300" rx="12" fill="#122440" stroke="#F5A352" stroke-width="1.6"/>
  <text x="199" y="114" text-anchor="middle" fill="#F5A352" font-family="monospace" font-size="12" font-weight="700">WHY FRAUD OCCURS (FRAUD TRIANGLE)</text>

  <!-- Triangle graphic -->
  <polygon points="199,144 92,312 306,312" fill="rgba(200, 78, 36, 0.2)" stroke="#F5A352" stroke-width="2.4"/>
  <text x="199" y="252" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">FRAUD</text>
  <text x="199" y="269" text-anchor="middle" fill="#F5A352" font-family="monospace" font-size="10">3 CONDITIONS</text>

  <!-- Vertex Labels -->
  <rect x="134" y="124" width="130" height="30" rx="7" fill="#C84E24"/>
  <text x="199" y="144" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">1. PRESSURE</text>

  <rect x="46" y="318" width="142" height="46" rx="7" fill="#2E6359"/>
  <text x="117" y="338" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">2. OPPORTUNITY</text>
  <text x="117" y="354" text-anchor="middle" fill="#D7EFE8" font-family="system-ui, sans-serif" font-size="9.5">Weak internal controls</text>

  <rect x="206" y="318" width="146" height="46" rx="7" fill="#254672" stroke="#6BC4B0" stroke-width="1.2"/>
  <text x="279" y="338" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">3. RATIONALIZATION</text>
  <text x="279" y="354" text-anchor="middle" fill="#CBDCE8" font-family="system-ui, sans-serif" font-size="9.5">"I'll pay it back later"</text>

  <!-- Connector Arrow -->
  <path d="M368 238 H406" stroke="#F07152" stroke-width="3" stroke-linecap="round"/>
  <path d="M399 230 L409 238 L399 246" fill="none" stroke="#F07152" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right: 4 Consequences Cascade -->
  <rect x="414" y="88" width="372" height="300" rx="12" fill="#122440" stroke="#F07152" stroke-width="1.6"/>
  <text x="600" y="114" text-anchor="middle" fill="#F07152" font-family="monospace" font-size="12" font-weight="700">CONSEQUENCES OF UNETHICAL BEHAVIOR</text>

  <g font-family="system-ui, sans-serif">
    <rect x="432" y="130" width="336" height="54" rx="8" fill="#1B365D" stroke="#F07152" stroke-width="1.2"/>
    <text x="446" y="150" fill="#F5A352" font-size="12" font-weight="700">1. Legal &amp; Criminal Penalties</text>
    <text x="446" y="169" fill="#E2EDF5" font-size="10.5">Heavy fines, lawsuits, asset seizure &amp; imprisonment.</text>

    <rect x="432" y="194" width="336" height="54" rx="8" fill="#1B365D" stroke="#F07152" stroke-width="1.2"/>
    <text x="446" y="214" fill="#F5A352" font-size="12" font-weight="700">2. Professional &amp; Career Ruin</text>
    <text x="446" y="233" fill="#E2EDF5" font-size="10.5">Dismissal, revoked license (ACCA/CPA) &amp; blacklisting.</text>

    <rect x="432" y="258" width="336" height="54" rx="8" fill="#1B365D" stroke="#F07152" stroke-width="1.2"/>
    <text x="446" y="278" fill="#F5A352" font-size="12" font-weight="700">3. Business Collapse &amp; Job Losses</text>
    <text x="446" y="297" fill="#E2EDF5" font-size="10.5">Bankruptcy, vanished pensions &amp; unpaid suppliers.</text>

    <rect x="432" y="322" width="336" height="52" rx="8" fill="#1B365D" stroke="#F07152" stroke-width="1.2"/>
    <text x="446" y="342" fill="#F5A352" font-size="12" font-weight="700">4. Damage to Market &amp; Public Trust</text>
    <text x="446" y="360" fill="#E2EDF5" font-size="10.5">Investors pull out; stricter laws &amp; higher audit costs.</text>
  </g>
</svg>
