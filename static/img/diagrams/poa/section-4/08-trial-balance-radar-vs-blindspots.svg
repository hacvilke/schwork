<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" fill="none" role="img" aria-label="Errors Caught by a Trial Balance Versus Six Hidden Errors That Do Not Affect Trial Balance Agreement">
  <rect width="820" height="430" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="402" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Trial Balance Radar: What It Catches vs. Its Six Blind Spots</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">AN EQUAL TRIAL BALANCE PROVES ARITHMETICAL EQUALITY — NOT 100% FREEDOM FROM ERRORS!</text>

  <!-- Left: Errors Caught (Breaks Trial Balance) -->
  <rect x="34" y="88" width="330" height="304" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="34" y="88" width="330" height="36" rx="9" fill="#4E8577"/>
  <text x="199" y="111" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">✓ CAUGHT (Dr ≠ Cr)</text>

  <g font-family="system-ui, sans-serif">
    <rect x="48" y="138" width="302" height="44" rx="7" fill="#1B365D"/>
    <text x="60" y="156" fill="#6BC4B0" font-size="11.5" font-weight="700">1. Single-Sided Posting</text>
    <text x="60" y="172" fill="#DCE8F2" font-size="10">Debited Cash $500, forgot to Credit Sales</text>

    <rect x="48" y="192" width="302" height="44" rx="7" fill="#1B365D"/>
    <text x="60" y="210" fill="#6BC4B0" font-size="11.5" font-weight="700">2. Unequal Amounts on Dr &amp; Cr</text>
    <text x="60" y="226" fill="#DCE8F2" font-size="10">Dr Rent $450, Cr Bank $540 (transposition)</text>

    <rect x="48" y="246" width="302" height="44" rx="7" fill="#1B365D"/>
    <text x="60" y="264" fill="#6BC4B0" font-size="11.5" font-weight="700">3. Two Debits or Two Credits</text>
    <text x="60" y="280" fill="#DCE8F2" font-size="10">Posted both halves to the Debit side!</text>

    <rect x="48" y="300" width="302" height="44" rx="7" fill="#1B365D"/>
    <text x="60" y="318" fill="#6BC4B0" font-size="11.5" font-weight="700">4. Addition / Extraction Slips</text>
    <text x="60" y="334" fill="#DCE8F2" font-size="10">Wrong balance c/d or wrong TB column</text>

    <text x="199" y="372" text-anchor="middle" fill="#9DD9CB" font-family="monospace" font-size="10" font-weight="700">Fixed via Suspense Account (Sec. 7)</text>
  </g>

  <!-- Right: 6 Blind Spots (Dr Still = Cr!) -->
  <rect x="382" y="88" width="404" height="304" rx="10" fill="#122440" stroke="#F5A352" stroke-width="2"/>
  <rect x="382" y="88" width="404" height="36" rx="9" fill="#C84E24"/>
  <text x="584" y="111" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">✕ 6 HIDDEN ERRORS (Dr STILL = Cr!)</text>

  <g font-family="system-ui, sans-serif">
    <rect x="396" y="136" width="184" height="72" rx="7" fill="#1B365D" stroke="#F5A352" stroke-width="1.1"/>
    <text x="406" y="154" fill="#F5A352" font-size="11.5" font-weight="800">1. Omission</text>
    <text x="406" y="170" fill="#DCE8F2" font-size="10">Whole transaction left out</text>
    <text x="406" y="184" fill="#A5C0D6" font-size="9.5">of books completely ($0/$0)</text>

    <rect x="590" y="136" width="184" height="72" rx="7" fill="#1B365D" stroke="#F5A352" stroke-width="1.1"/>
    <text x="600" y="154" fill="#F5A352" font-size="11.5" font-weight="800">2. Commission</text>
    <text x="600" y="170" fill="#DCE8F2" font-size="10">Wrong person’s account</text>
    <text x="600" y="184" fill="#A5C0D6" font-size="9.5">(J. Smith instead of A. Smith)</text>

    <rect x="396" y="218" width="184" height="72" rx="7" fill="#1B365D" stroke="#F5A352" stroke-width="1.1"/>
    <text x="406" y="236" fill="#F5A352" font-size="11.5" font-weight="800">3. Principle</text>
    <text x="406" y="252" fill="#DCE8F2" font-size="10">Wrong CLASS of account</text>
    <text x="406" y="266" fill="#A5C0D6" font-size="9.5">(Motor Repairs vs. Vehicles)</text>

    <rect x="590" y="218" width="184" height="72" rx="7" fill="#1B365D" stroke="#F5A352" stroke-width="1.1"/>
    <text x="600" y="236" fill="#F5A352" font-size="11.5" font-weight="800">4. Original Entry</text>
    <text x="600" y="252" fill="#DCE8F2" font-size="10">Wrong figure on BOTH sides</text>
    <text x="600" y="266" fill="#A5C0D6" font-size="9.5">(Dr $80 / Cr $80 instead $800)</text>

    <rect x="396" y="300" width="184" height="72" rx="7" fill="#1B365D" stroke="#F5A352" stroke-width="1.1"/>
    <text x="406" y="318" fill="#F5A352" font-size="11.5" font-weight="800">5. Complete Reversal</text>
    <text x="406" y="334" fill="#DCE8F2" font-size="10">Dr and Cr swapped totally</text>
    <text x="406" y="348" fill="#A5C0D6" font-size="9.5">(Dr Sales / Cr Cash!)</text>

    <rect x="590" y="300" width="184" height="72" rx="7" fill="#1B365D" stroke="#F5A352" stroke-width="1.1"/>
    <text x="600" y="318" fill="#F5A352" font-size="11.5" font-weight="800">6. Compensating</text>
    <text x="600" y="334" fill="#DCE8F2" font-size="10">Two separate errors cancel</text>
    <text x="600" y="348" fill="#A5C0D6" font-size="9.5">(Sales +$50 &amp; Rent +$50)</text>
  </g>
</svg>
