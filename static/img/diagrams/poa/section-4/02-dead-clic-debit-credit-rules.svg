<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" fill="none" role="img" aria-label="DEAD CLIC Modern Debit and Credit Rules Cheat Sheet">
  <rect width="820" height="420" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="392" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Double-Entry Rules of Debit &amp; Credit: Master DEAD CLIC</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">EVERY TRANSACTION HAS AT LEAST ONE DEBIT AND ONE EQUAL CREDIT (DEBITS = CREDITS)</text>

  <!-- Left Card: DEAD (Debits) -->
  <rect x="34" y="88" width="366" height="232" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="2"/>
  <rect x="34" y="88" width="366" height="44" rx="10" fill="#4E8577"/>
  <text x="217" y="108" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">D · E · A · D</text>
  <text x="217" y="124" text-anchor="middle" fill="#EBF2EF" font-family="monospace" font-size="10">DEBIT TO INCREASE  (+)   |   CREDIT TO DECREASE  (−)</text>

  <g font-family="system-ui, sans-serif">
    <rect x="52" y="146" width="330" height="34" rx="6" fill="#1B365D" stroke="#6BC4B0"/>
    <text x="68" y="168" fill="#6BC4B0" font-size="13" font-weight="800">D</text>
    <text x="90" y="168" fill="#FFFFFF" font-size="12" font-weight="700">Debit Normal Balance Accounts:</text>

    <text x="64" y="202" fill="#6BC4B0" font-size="14" font-weight="800">E</text>
    <text x="86" y="202" fill="#DCE8F2" font-size="12"><tspan font-weight="700" fill="#FFFFFF">Expenses</tspan> (Rent, Wages, Purchases, Disc. All.)</text>

    <text x="64" y="232" fill="#6BC4B0" font-size="14" font-weight="800">A</text>
    <text x="86" y="232" fill="#DCE8F2" font-size="12"><tspan font-weight="700" fill="#FFFFFF">Assets</tspan> (Cash, Bank, Vans, Inventory, Debtors)</text>

    <text x="64" y="262" fill="#6BC4B0" font-size="14" font-weight="800">D</text>
    <text x="86" y="262" fill="#DCE8F2" font-size="12"><tspan font-weight="700" fill="#FFFFFF">Drawings</tspan> (Owner’s personal withdrawals)</text>

    <text x="64" y="298" fill="#9DD9CB" font-family="monospace" font-size="10.5" font-weight="700">↑ Goes UP → DEBIT   ·   ↓ Goes DOWN → CREDIT</text>
  </g>

  <!-- Right Card: CLIC (Credits) -->
  <rect x="420" y="88" width="366" height="232" rx="10" fill="#122440" stroke="#F5A352" stroke-width="2"/>
  <rect x="420" y="88" width="366" height="44" rx="10" fill="#C84E24"/>
  <text x="603" y="108" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">C · L · I · C</text>
  <text x="603" y="124" text-anchor="middle" fill="#FDEFDF" font-family="monospace" font-size="10">CREDIT TO INCREASE  (+)   |   DEBIT TO DECREASE  (−)</text>

  <g font-family="system-ui, sans-serif">
    <rect x="438" y="146" width="330" height="34" rx="6" fill="#1B365D" stroke="#F5A352"/>
    <text x="454" y="168" fill="#F5A352" font-size="13" font-weight="800">C</text>
    <text x="476" y="168" fill="#FFFFFF" font-size="12" font-weight="700">Credit Normal Balance Accounts:</text>

    <text x="450" y="202" fill="#F5A352" font-size="14" font-weight="800">L</text>
    <text x="472" y="202" fill="#DCE8F2" font-size="12"><tspan font-weight="700" fill="#FFFFFF">Liabilities</tspan> (Loans, Creditors, Overdraft)</text>

    <text x="450" y="232" fill="#F5A352" font-size="14" font-weight="800">I</text>
    <text x="472" y="232" fill="#DCE8F2" font-size="12"><tspan font-weight="700" fill="#FFFFFF">Income</tspan> (Sales, Commission &amp; Disc. Rec’d)</text>

    <text x="450" y="262" fill="#F5A352" font-size="14" font-weight="800">C</text>
    <text x="472" y="262" fill="#DCE8F2" font-size="12"><tspan font-weight="700" fill="#FFFFFF">Capital</tspan> (Owner’s equity invested)</text>

    <text x="450" y="298" fill="#F5A352" font-family="monospace" font-size="10.5" font-weight="700">↑ Goes UP → CREDIT   ·   ↓ Goes DOWN → DEBIT</text>
  </g>

  <!-- Bottom Classic Golden Rules Strip -->
  <rect x="34" y="336" width="752" height="54" rx="9" fill="#122440" stroke="#8CC4B4" stroke-width="1.3"/>
  <text x="52" y="356" fill="#9DD9CB" font-family="monospace" font-size="10.5" font-weight="700">CLASSIC THREE GOLDEN RULES (BY ACCOUNT CLASS):</text>
  <text x="52" y="376" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11"><tspan fill="#6BC4B0" font-weight="700">Personal:</tspan> Dr Receiver, Cr Giver  ·  <tspan fill="#9DD9CB" font-weight="700">Real:</tspan> Dr What Comes In, Cr What Goes Out  ·  <tspan fill="#F5A352" font-weight="700">Nominal:</tspan> Dr Expenses/Losses, Cr Income/Gains</text>
</svg>
