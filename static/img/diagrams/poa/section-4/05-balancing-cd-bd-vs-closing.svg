<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" fill="none" role="img" aria-label="Balancing Permanent Accounts with c/d and b/d Versus Closing Nominal Accounts to the Income Statement">
  <rect width="820" height="420" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="392" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Period-End Finish: Balancing (c/d → b/d) vs. Closing Accounts</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">PERMANENT ACCOUNTS ROLL FORWARD TO NEXT YEAR · NOMINAL ACCOUNTS CLOSE TO INCOME STATEMENT</text>

  <!-- Left: Balancing Permanent Account -->
  <rect x="34" y="88" width="368" height="298" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="34" y="88" width="368" height="34" rx="9" fill="#4E8577"/>
  <text x="218" y="110" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">1. BALANCING (Assets, Liabilities, Capital)</text>

  <text x="50" y="142" fill="#9DD9CB" font-family="monospace" font-size="10" font-weight="700">EXAMPLE: CUSTOMER K. BROWN A/C (DEBTOR)</text>
  <line x1="48" y1="154" x2="388" y2="154" stroke="#6BC4B0" stroke-width="1.5"/>
  <line x1="218" y1="154" x2="218" y2="276" stroke="#6BC4B0" stroke-width="1.5"/>

  <g font-family="monospace" font-size="9.5" fill="#DCE8F2">
    <text x="50" y="172">Dec 4  Sales      900</text>
    <text x="50" y="190">Dec18  Sales      400</text>
    <text x="226" y="172">Dec12  Bank       700</text>
    <text x="226" y="190">Dec15  Ret. In    100</text>
    <text x="226" y="212" fill="#F5A352" font-weight="700">Dec31  Bal. c/d   500</text>
  </g>
  <line x1="48" y1="224" x2="388" y2="224" stroke="#6BC4B0"/>
  <text x="50" y="240" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">       Total    1,300</text>
  <text x="226" y="240" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">       Total    1,300</text>
  <line x1="48" y1="246" x2="388" y2="246" stroke="#6BC4B0"/>
  <line x1="48" y1="250" x2="388" y2="250" stroke="#6BC4B0"/>
  <text x="50" y="270" fill="#6BC4B0" font-family="monospace" font-size="10.5" font-weight="800">Jan 1  Bal. b/d   500</text>

  <rect x="48" y="294" width="340" height="76" rx="7" fill="#1B365D" stroke="#6BC4B0"/>
  <text x="62" y="314" fill="#6BC4B0" font-family="monospace" font-size="10" font-weight="700">MEANING OF c/d AND b/d</text>
  <text x="62" y="332" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="10.5">• <tspan font-weight="700">c/d (carried down):</tspan> Goes on SHORTER side to equalize totals.</text>
  <text x="62" y="348" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="10.5">• <tspan font-weight="700">b/d (brought down):</tspan> Flips to LARGER side on Day 1 next year.</text>
  <text x="62" y="363" fill="#9DD9CB" font-family="system-ui, sans-serif" font-size="10">  (K. Brown still owes $500 → Debit Balance → Balance Sheet!)</text>

  <!-- Right: Closing Nominal Account -->
  <rect x="418" y="88" width="368" height="298" rx="10" fill="#122440" stroke="#F5A352" stroke-width="1.8"/>
  <rect x="418" y="88" width="368" height="34" rx="9" fill="#C84E24"/>
  <text x="602" y="110" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">2. CLOSING (Revenues &amp; Expenses)</text>

  <text x="434" y="142" fill="#F5A352" font-family="monospace" font-size="10" font-weight="700">EXAMPLE: RENT EXPENSE ACCOUNT (NOMINAL)</text>
  <line x1="432" y1="154" x2="772" y2="154" stroke="#F5A352" stroke-width="1.5"/>
  <line x1="602" y1="154" x2="602" y2="276" stroke="#F5A352" stroke-width="1.5"/>

  <g font-family="monospace" font-size="9.5" fill="#DCE8F2">
    <text x="434" y="172">Oct 1  Bank       800</text>
    <text x="434" y="190">Nov 1  Bank       800</text>
    <text x="434" y="208">Dec 1  Bank       800</text>
    <text x="610" y="208" fill="#F5A352" font-weight="700">Dec31  Income Stmt 2,400</text>
  </g>
  <line x1="432" y1="224" x2="772" y2="224" stroke="#F5A352"/>
  <text x="434" y="240" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">       Total    2,400</text>
  <text x="610" y="240" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">       Total    2,400</text>
  <line x1="432" y1="246" x2="772" y2="246" stroke="#F5A352"/>
  <line x1="432" y1="250" x2="772" y2="250" stroke="#F5A352"/>
  <text x="602" y="270" text-anchor="middle" fill="#F5A352" font-family="monospace" font-size="10.5" font-weight="800">NO Balance b/d! Resets to $0 for Year 2!</text>

  <rect x="432" y="294" width="340" height="76" rx="7" fill="#1B365D" stroke="#F5A352"/>
  <text x="446" y="314" fill="#F5A352" font-family="monospace" font-size="10" font-weight="700">WHY CLOSE NOMINAL ACCOUNTS?</text>
  <text x="446" y="332" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="10.5">• Transfers full-year revenue &amp; expenses into Income Statement</text>
  <text x="446" y="348" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="10.5">  so Net Profit for THIS year is measured cleanly.</text>
  <text x="446" y="363" fill="#FDEFDF" font-family="system-ui, sans-serif" font-size="10">• Drawings closes to Owner’s Capital at year-end too!</text>
</svg>
