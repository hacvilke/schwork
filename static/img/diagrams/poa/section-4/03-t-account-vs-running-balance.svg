<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" fill="none" role="img" aria-label="Comparison of Classic T-Account Format and Running-Balance Three-Column Account Format">
  <rect width="820" height="420" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="392" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Ledger Account Formats: T-Account vs. Running-Balance Style</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">SAME TRANSACTIONS · SAME FINAL BALANCE ($1,300 DR) · TWO CLEAN LAYOUTS</text>

  <!-- Left: Classic T-Account -->
  <rect x="34" y="88" width="376" height="236" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="34" y="88" width="376" height="32" rx="9" fill="#4E8577"/>
  <text x="222" y="109" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">1. Classic T-Account — Bank Account</text>

  <!-- Big T lines -->
  <line x1="46" y1="146" x2="398" y2="146" stroke="#F5A352" stroke-width="2.2"/>
  <line x1="222" y1="126" x2="222" y2="306" stroke="#F5A352" stroke-width="2.2"/>

  <text x="50" y="139" fill="#6BC4B0" font-family="monospace" font-size="10" font-weight="700">Dr · Date  Details    $</text>
  <text x="230" y="139" fill="#F5A352" font-family="monospace" font-size="10" font-weight="700">Cr · Date  Details    $</text>

  <g font-family="monospace" font-size="10" fill="#DCE8F2">
    <text x="50" y="166">May 1  Capital    2,000</text>
    <text x="50" y="186">May 8  Sales        600</text>
    <text x="230" y="166">May 4  Rent         800</text>
    <text x="230" y="186">May12  Equipment    500</text>
    <text x="230" y="218" fill="#6BC4B0" font-weight="700">May31  Bal. c/d   1,300</text>
  </g>
  <line x1="48" y1="232" x2="396" y2="232" stroke="#6BC4B0"/>
  <text x="50" y="249" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">       Total      2,600</text>
  <text x="230" y="249" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">       Total      2,600</text>
  <line x1="48" y1="256" x2="396" y2="256" stroke="#6BC4B0"/>
  <line x1="48" y1="260" x2="396" y2="260" stroke="#6BC4B0"/>
  <text x="50" y="282" fill="#6BC4B0" font-family="monospace" font-size="10.5" font-weight="700">Jun 1  Bal. b/d   1,300</text>
  <text x="230" y="282" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="9.5">Left = Debit · Right = Credit</text>

  <!-- Right: Running Balance (3-Column) Account -->
  <rect x="424" y="88" width="362" height="236" rx="10" fill="#122440" stroke="#F5A352" stroke-width="1.8"/>
  <rect x="424" y="88" width="362" height="32" rx="9" fill="#C84E24"/>
  <text x="605" y="109" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">2. Running-Balance Format — Bank</text>

  <text x="436" y="139" fill="#F5A352" font-family="monospace" font-size="9.5" font-weight="700">Date   Details      Dr     Cr    Balance</text>
  <line x1="432" y1="146" x2="778" y2="146" stroke="#2D507C"/>

  <g font-family="monospace" font-size="9.5" fill="#DCE8F2">
    <text x="436" y="168">May 1  Capital    2,000    —   2,000 Dr</text>
    <text x="436" y="192">May 4  Rent         —     800  1,200 Dr</text>
    <text x="436" y="216">May 8  Sales       600     —   1,800 Dr</text>
    <text x="436" y="240">May12  Equipment    —     500  1,300 Dr</text>
  </g>
  <rect x="436" y="264" width="338" height="44" rx="7" fill="#1B365D" stroke="#F5A352"/>
  <text x="448" y="282" fill="#F5A352" font-family="monospace" font-size="10" font-weight="700">INSTANT BALANCE AFTER EVERY LINE!</text>
  <text x="448" y="299" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="10.5">Preferred by banks &amp; accounting software (no c/d row!).</text>

  <!-- Bottom Cross-Naming Rule Callout -->
  <rect x="34" y="340" width="752" height="52" rx="9" fill="#122440" stroke="#6BC4B0" stroke-width="1.3"/>
  <text x="52" y="361" fill="#F5A352" font-family="monospace" font-size="10.5" font-weight="700">THE “OPPOSITE ACCOUNT NAME” RULE (DON’T WRITE THE ACCOUNT’S OWN NAME!):</text>
  <text x="52" y="380" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11.5">Inside the <tspan fill="#6BC4B0" font-weight="700">Bank Account</tspan>, never write "Bank" in Details — write the <tspan fill="#F5A352" font-weight="700">other half of the double entry</tspan> (Capital, Rent, Sales, Equipment)!</text>
</svg>
