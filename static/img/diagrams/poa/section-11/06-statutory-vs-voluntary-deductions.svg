<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="Comparison of Statutory Deductions required by Law versus Voluntary Deductions authorized by the Employee, plus Employer Payroll Contributions">
  <defs>
    <style>
      .bg { fill: #F8F6F1; }
      .card { fill: #FCFBF8; stroke: #CEDCD6; stroke-width: 2; rx: 12; }
      .navy { fill: #1B365D; rx: 10; }
      .sage { fill: #2E6359; rx: 10; }
      .coral { fill: #C84E24; rx: 10; }
      .mint { fill: #EBF2EF; stroke: #4E8577; stroke-width: 1.5; rx: 8; }
      .amber { fill: #FEF3E2; stroke: #F5A352; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 800; fill: #1B365D; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #4A5560; }
      .w-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 800; fill: #FFFFFF; }
      .w-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #EBF2EF; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 800; fill: #1B365D; }
      .body { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #222222; }
      .coral-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 800; fill: #C84E24; }
    </style>
  </defs>

  <rect class="bg" width="920" height="470"/>
  <text x="460" y="34" text-anchor="middle" class="title">Statutory (Compulsory) vs. Voluntary Payroll Deductions</text>
  <text x="460" y="54" text-anchor="middle" class="subtitle">Every deduction withheld from an employee’s pay becomes a Current Liability until remitted to the tax office, union, or lender!</text>

  <!-- Left Column: Statutory Deductions -->
  <rect class="card" x="24" y="74" width="424" height="304"/>
  <rect class="coral" x="36" y="86" width="400" height="44"/>
  <text x="236" y="106" text-anchor="middle" class="w-title">1. STATUTORY DEDUCTIONS (BY LAW!)</text>
  <text x="236" y="123" text-anchor="middle" class="w-sub">Compulsory — Employee CANNOT opt out!</text>

  <rect class="amber" x="40" y="144" width="392" height="54"/>
  <text x="54" y="164" class="coral-txt">Income Tax (PAYE — Pay As You Earn)</text>
  <text x="54" y="183" class="body">Applied ONLY to Taxable Income ABOVE tax-free allowance!</text>

  <rect class="amber" x="40" y="206" width="392" height="54"/>
  <text x="54" y="226" class="coral-txt">National Insurance Scheme (NIS / Social Security)</text>
  <text x="54" y="245" class="body">Funds retirement pensions, maternity &amp; injury benefits.</text>

  <rect class="amber" x="40" y="268" width="392" height="54"/>
  <text x="54" y="288" class="coral-txt">Education Tax / National Housing Trust (NHT)</text>
  <text x="54" y="307" class="body">Statutory Caribbean levies remitted monthly to government.</text>

  <text x="236" y="356" text-anchor="middle" class="coral-txt">Remitted directly to Government Revenue Authorities!</text>

  <!-- Right Column: Voluntary Deductions -->
  <rect class="card" x="472" y="74" width="424" height="304"/>
  <rect class="sage" x="484" y="86" width="400" height="44"/>
  <text x="684" y="106" text-anchor="middle" class="w-title">2. VOLUNTARY DEDUCTIONS (BY CHOICE!)</text>
  <text x="684" y="123" text-anchor="middle" class="w-sub">Requires employee’s signed written authorization!</text>

  <rect class="mint" x="488" y="144" width="392" height="54"/>
  <text x="502" y="164" class="label">Mortgage / Credit Union Loan &amp; Savings</text>
  <text x="502" y="183" class="body">Salary deductions sent straight to building society or CU.</text>

  <rect class="mint" x="488" y="206" width="392" height="54"/>
  <text x="502" y="226" class="label">Private Health Insurance &amp; Pension Plan</text>
  <text x="502" y="245" class="body">Group medical/dental coverage and retirement savings.</text>

  <rect class="mint" x="488" y="268" width="392" height="54"/>
  <text x="502" y="288" class="label">Trade Union Dues &amp; Charity / Staff Club</text>
  <text x="502" y="307" class="body">Optional union membership fees and charity pledges.</text>

  <text x="684" y="356" text-anchor="middle" class="label">Remitted to Credit Unions, Insurers, Banks &amp; Unions!</text>

  <!-- Bottom Employer Contribution Banner -->
  <rect class="navy" x="24" y="394" width="872" height="60"/>
  <text x="460" y="418" text-anchor="middle" class="w-title">DON’T CONFUSE EMPLOYEE DEDUCTIONS vs. EMPLOYER’S MATCHING CONTRIBUTIONS!</text>
  <text x="460" y="438" text-anchor="middle" class="w-sub">Employee NIS reduces the worker’s Net Pay; Employer’s Matching NIS is an EXTRA Business Expense (NOT deducted from staff pay!)</text>
</svg>
