<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="Gross Pay Calculation Framework covering Hourly Wages with Overtime Tiers, Fixed Monthly Salary, Piece-Rate Pay, and Sales Commission">
  <defs>
    <style>
      .bg { fill: #F8F6F1; }
      .card { fill: #FCFBF8; stroke: #CEDCD6; stroke-width: 2; rx: 12; }
      .navy { fill: #1B365D; rx: 10; }
      .sage { fill: #2E6359; rx: 10; }
      .coral { fill: #C84E24; rx: 10; }
      .mint { fill: #EBF2EF; stroke: #4E8577; stroke-width: 1.5; rx: 8; }
      .amber { fill: #FEF3E2; stroke: #F5A352; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 800; fill: #1B365D; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #4A5560; }
      .w-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 800; fill: #FFFFFF; }
      .w-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #EBF2EF; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 800; fill: #1B365D; }
      .body { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #222222; }
      .coral-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 800; fill: #C84E24; }
    </style>
  </defs>

  <rect class="bg" width="920" height="470"/>
  <text x="460" y="34" text-anchor="middle" class="title">Calculating Gross Pay: Overtime Tiers &amp; Four Remuneration Methods</text>
  <text x="460" y="54" text-anchor="middle" class="subtitle">Gross Pay = Total earnings BEFORE ANY tax or deduction is removed — split hours cleanly across Basic, 1.5×, and 2× tiers!</text>

  <!-- Left Panel: Overtime Staircase -->
  <rect class="card" x="24" y="74" width="444" height="316"/>
  <rect class="navy" x="36" y="86" width="420" height="42"/>
  <text x="246" y="112" text-anchor="middle" class="w-title">HOURLY WAGES &amp; OVERTIME TIERS (Base = $20/hr)</text>

  <rect class="mint" x="40" y="142" width="412" height="62"/>
  <text x="54" y="162" class="label">Tier 1 — Basic Regular Hours (First 40 hrs @ 1.0×)</text>
  <text x="54" y="180" class="body">40 hrs × $20.00/hr  =  $800.00</text>
  <text x="54" y="196" class="body">Standard workweek (Monday–Friday normal shift)</text>

  <rect class="amber" x="40" y="214" width="412" height="62"/>
  <text x="54" y="234" class="coral-txt">Tier 2 — Time-and-a-Half (Extra Weekday / Sat @ 1.5×)</text>
  <text x="54" y="252" class="body">1.5 × $20 = $30.00/hr  →  6 hrs × $30.00 = $180.00</text>
  <text x="54" y="268" class="body">Rewards working past 40 standard weekly hours!</text>

  <rect class="coral" x="40" y="286" width="412" height="58"/>
  <text x="54" y="307" class="w-title">Tier 3 — Double Time (Sunday / Public Holiday @ 2.0×)</text>
  <text x="54" y="327" class="w-sub">2.0 × $20 = $40.00/hr  →  4 hrs × $40.00 = $160.00</text>

  <text x="246" y="372" text-anchor="middle" class="label">TOTAL GROSS PAY (50 hrs): $800 + $180 + $160 = $1,140.00!</text>

  <!-- Right Panel: Other 3 Pay Systems -->
  <rect class="card" x="488" y="74" width="408" height="316"/>
  <rect class="sage" x="500" y="86" width="384" height="42"/>
  <text x="692" y="112" text-anchor="middle" class="w-title">3 OTHER PAY STRUCTURES TO KNOW!</text>

  <rect class="mint" x="504" y="142" width="376" height="72"/>
  <text x="518" y="162" class="label">1. Fixed Salary (Monthly / Annual)</text>
  <text x="518" y="180" class="body">Annual Salary ÷ 12 (or ÷ 26 bi-weekly)</text>
  <text x="518" y="198" class="body">e.g. $48,000/yr ÷ 12 = $4,000/month (managers, office)</text>

  <rect class="mint" x="504" y="224" width="376" height="72"/>
  <text x="518" y="244" class="label">2. Piece-Rate Pay (Pay per Good Unit Made)</text>
  <text x="518" y="262" class="body">Good Units Produced × Rate per Unit</text>
  <text x="518" y="280" class="body">e.g. 240 shirts sewn × $4.50/shirt = $1,080 (watch quality!)</text>

  <rect class="amber" x="504" y="306" width="376" height="72"/>
  <text x="518" y="326" class="coral-txt">3. Basic Salary + Sales Commission</text>
  <text x="518" y="344" class="body">Base Pay + (% × Sales Above Threshold)</text>
  <text x="518" y="362" class="body">e.g. $600 Base + 5% × $8,000 Sales = $1,000 Gross Pay!</text>

  <!-- Bottom Trap Banner -->
  <rect class="navy" x="24" y="406" width="872" height="50"/>
  <text x="460" y="427" text-anchor="middle" class="w-title">OVERTIME TRAP CHECK: ALWAYS SPLIT TOTAL HOURS BEFORE MULTIPLYING!</text>
  <text x="460" y="445" text-anchor="middle" class="w-sub">If a worker logged 50 hrs total (40 regular + 6 at 1.5× + 4 at 2×), NEVER multiply all 50 hrs by 1.5× — split every tier cleanly!</text>
</svg>
