<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" fill="none" role="img" aria-label="Sole-Trader Vertical Income Statement Waterfall Structure">
  <rect width="820" height="430" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="402" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Sole-Trader Vertical Income Statement: Two-Part Waterfall</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">PART 1: TRADING SECTION (GROSS PROFIT)  →  PART 2: PROFIT &amp; LOSS SECTION (NET PROFIT)</text>

  <!-- Left Part 1: Trading Section -->
  <rect x="34" y="88" width="368" height="304" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="34" y="88" width="368" height="34" rx="9" fill="#4E8577"/>
  <text x="218" y="110" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11.5" font-weight="800">PART 1 · TRADING SECTION</text>

  <g font-family="system-ui, sans-serif" font-size="11.5">
    <rect x="48" y="136" width="340" height="48" rx="7" fill="#1B365D" stroke="#6BC4B0"/>
    <text x="62" y="155" fill="#6BC4B0" font-weight="800">1. Net Sales (Turnover)</text>
    <text x="62" y="173" fill="#DCE8F2" font-size="10.5">Sales Revenue  −  Returns Inwards (Sales Returns)</text>

    <text x="218" y="200" text-anchor="middle" fill="#F5A352" font-family="monospace" font-size="11" font-weight="800">MINUS (−)</text>

    <rect x="48" y="208" width="340" height="106" rx="7" fill="#1B365D" stroke="#8CC4B4"/>
    <text x="62" y="227" fill="#9DD9CB" font-weight="800">2. Cost of Goods Sold (COGS)</text>
    <text x="62" y="246" fill="#DCE8F2" font-size="10.5">Opening Inventory (1 Jan)</text>
    <text x="62" y="262" fill="#DCE8F2" font-size="10.5">+ Net Purchases (Purchases − Ret. Out + Carriage In)</text>
    <text x="62" y="278" fill="#A5C0D6" font-size="10">= Cost of Goods Available for Sale</text>
    <text x="62" y="296" fill="#F5A352" font-size="10.5" font-weight="700">− Closing Inventory (31 Dec)</text>

    <rect x="48" y="328" width="340" height="48" rx="8" fill="#132F34" stroke="#6BC4B0" stroke-width="1.8"/>
    <text x="218" y="349" text-anchor="middle" fill="#6BC4B0" font-size="13" font-weight="800">= GROSS PROFIT (or Gross Loss)</text>
    <text x="218" y="366" text-anchor="middle" fill="#DCE8F2" font-size="10">Profit made strictly from buying &amp; selling stock</text>
  </g>

  <!-- Connector Arrow Part 1 -> Part 2 -->
  <path d="M402 352 H412 V154 H422" stroke="#F5A352" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M416 148 L425 154 L416 160" fill="none" stroke="#F5A352" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Right Part 2: Profit & Loss Section -->
  <rect x="426" y="88" width="360" height="304" rx="10" fill="#122440" stroke="#F5A352" stroke-width="1.8"/>
  <rect x="426" y="88" width="360" height="34" rx="9" fill="#C84E24"/>
  <text x="606" y="110" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11.5" font-weight="800">PART 2 · PROFIT &amp; LOSS SECTION</text>

  <g font-family="system-ui, sans-serif" font-size="11.5">
    <rect x="440" y="136" width="332" height="40" rx="7" fill="#132F34" stroke="#6BC4B0"/>
    <text x="606" y="161" text-anchor="middle" fill="#FFFFFF" font-weight="800">Start With: GROSS PROFIT</text>

    <rect x="440" y="188" width="332" height="54" rx="7" fill="#1B365D" stroke="#6BC4B0"/>
    <text x="454" y="207" fill="#6BC4B0" font-weight="800">+ Add: Other Income</text>
    <text x="454" y="226" fill="#DCE8F2" font-size="10.5">Discount Received, Commission Rec’d, Rent Rec’d</text>

    <rect x="440" y="254" width="332" height="64" rx="7" fill="#1B365D" stroke="#F5A352"/>
    <text x="454" y="273" fill="#F5A352" font-weight="800">− Less: Operating Expenses</text>
    <text x="454" y="291" fill="#DCE8F2" font-size="10.5">Wages, Rent, Utilities, Insurance, Carriage Out,</text>
    <text x="454" y="307" fill="#DCE8F2" font-size="10.5">Discount Allowed, Bad Debts, Depreciation</text>

    <rect x="440" y="328" width="332" height="48" rx="8" fill="#F5A352"/>
    <text x="606" y="349" text-anchor="middle" fill="#122440" font-size="13.5" font-weight="800">= NET PROFIT (or Net Loss)</text>
    <text x="606" y="366" text-anchor="middle" fill="#122440" font-size="10" font-weight="700">Transfers directly into Owner’s Capital!</text>
  </g>
</svg>
