<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" fill="none" role="img" aria-label="Five-Block Vertical Classified Balance Sheet Blueprint">
  <rect width="820" height="430" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="402" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Vertical Classified Balance Sheet Blueprint (3-Column Style)</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">TOP HALF: NET ASSETS (HOW FUNDS ARE USED)  =  BOTTOM HALF: FINANCED BY (WHERE FUNDS CAME FROM)</text>

  <!-- Left Visual Stack (Top Half) -->
  <rect x="34" y="88" width="372" height="306" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="34" y="88" width="372" height="32" rx="9" fill="#4E8577"/>
  <text x="220" y="109" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="800">TOP HALF · ASSETS &amp; WORKING CAPITAL</text>

  <g font-family="system-ui, sans-serif">
    <rect x="48" y="132" width="344" height="72" rx="7" fill="#1B365D" stroke="#6BC4B0"/>
    <text x="60" y="150" fill="#6BC4B0" font-size="11" font-weight="800">1. NON-CURRENT ASSETS (3 Columns!)</text>
    <text x="60" y="168" fill="#DCE8F2" font-size="10.5">Cost  −  Accum. Depreciation  =  Net Book Value (NBV)</text>
    <text x="60" y="185" fill="#A5C0D6" font-size="10">Premises → Machinery → Fixtures → Vehicles → Equip.</text>

    <rect x="48" y="214" width="344" height="52" rx="7" fill="#1B365D" stroke="#8CC4B4"/>
    <text x="60" y="232" fill="#9DD9CB" font-size="11" font-weight="800">2. CURRENT ASSETS</text>
    <text x="60" y="250" fill="#DCE8F2" font-size="10.5">Closing Stock → Receivables (− Prov.) → Prepay → Bank → Cash</text>

    <rect x="48" y="274" width="344" height="50" rx="7" fill="#2A1D24" stroke="#F5A352"/>
    <text x="60" y="292" fill="#F5A352" font-size="11" font-weight="800">3. LESS: CURRENT LIABILITIES</text>
    <text x="60" y="310" fill="#FDEFDF" font-size="10.5">Trade Payables, Accrued Expenses, Bank Overdraft</text>

    <rect x="48" y="334" width="344" height="46" rx="8" fill="#6BC4B0"/>
    <text x="220" y="354" text-anchor="middle" fill="#122440" font-size="12" font-weight="800">TOTAL NET ASSETS = NCA + Working Capital</text>
    <text x="220" y="370" text-anchor="middle" fill="#122440" font-size="10" font-weight="700">(Double-underlined top half total!)</text>
  </g>

  <!-- Center Equals Badge -->
  <circle cx="416" cy="357" r="14" fill="#F5A352"/>
  <text x="416" y="362" text-anchor="middle" fill="#122440" font-family="monospace" font-size="16" font-weight="800">=</text>

  <!-- Right Visual Stack (Bottom Half) -->
  <rect x="426" y="88" width="360" height="306" rx="10" fill="#122440" stroke="#F5A352" stroke-width="1.8"/>
  <rect x="426" y="88" width="360" height="32" rx="9" fill="#C84E24"/>
  <text x="606" y="109" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="800">BOTTOM HALF · FINANCED BY</text>

  <g font-family="system-ui, sans-serif">
    <rect x="440" y="132" width="332" height="114" rx="7" fill="#1B365D" stroke="#F5A352"/>
    <text x="454" y="152" fill="#F5A352" font-size="11" font-weight="800">4. OWNER’S CAPITAL (EQUITY)</text>
    <text x="454" y="172" fill="#DCE8F2" font-size="11">Opening Capital (1 Jan)</text>
    <text x="454" y="190" fill="#6BC4B0" font-size="11" font-weight="700">+ Add: Net Profit (or − Less: Net Loss)</text>
    <text x="454" y="208" fill="#F5A352" font-size="11" font-weight="700">− Less: Drawings</text>
    <text x="454" y="230" fill="#FFFFFF" font-size="11.5" font-weight="800">= Closing Capital (Owner’s Net Worth)</text>

    <rect x="440" y="258" width="332" height="64" rx="7" fill="#1B365D" stroke="#8CC4B4"/>
    <text x="454" y="278" fill="#9DD9CB" font-size="11" font-weight="800">5. ADD: NON-CURRENT LIABILITIES</text>
    <text x="454" y="297" fill="#DCE8F2" font-size="10.5">Long-Term Bank Loans (&gt;1 yr), Mortgages</text>
    <text x="454" y="313" fill="#A5C0D6" font-size="10">(Alternative style deducts NCL from Net Assets above!)</text>

    <rect x="440" y="334" width="332" height="46" rx="8" fill="#F5A352"/>
    <text x="606" y="354" text-anchor="middle" fill="#122440" font-size="12" font-weight="800">CAPITAL EMPLOYED = Capital + NCL</text>
    <text x="606" y="370" text-anchor="middle" fill="#122440" font-size="10" font-weight="700">MUST match Total Net Assets to the penny!</text>
  </g>
</svg>
