<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" fill="none" role="img" aria-label="Profitability and Stock Efficiency Ratios Dashboard: Gross Profit Margin, Mark-Up, Net Profit Margin, and Stock Turnover">
  <rect width="820" height="420" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="392" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Profitability &amp; Efficiency Ratios Formula Dashboard</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">HOW PROFIT IS MEASURED RELATIVE TO SALES, COST &amp; INVENTORY SPEED</text>

  <!-- Card 1: Gross Profit Margin -->
  <rect x="34" y="88" width="368" height="136" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="34" y="88" width="368" height="30" rx="9" fill="#4E8577"/>
  <text x="218" y="108" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="800">1. GROSS PROFIT MARGIN (GP %)</text>
  <text x="218" y="144" text-anchor="middle" fill="#6BC4B0" font-family="system-ui, sans-serif" font-size="15" font-weight="800">(Gross Profit ÷ Net Sales) × 100</text>
  <text x="218" y="170" text-anchor="middle" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11">Cents of Gross Profit kept per $1 of Sales</text>
  <text x="218" y="192" text-anchor="middle" fill="#9DD9CB" font-family="monospace" font-size="10">Tests: Selling prices &amp; supplier cost control</text>
  <text x="218" y="210" text-anchor="middle" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10">Higher % = stronger trading margin</text>

  <!-- Card 2: Mark-Up -->
  <rect x="418" y="88" width="368" height="136" rx="10" fill="#122440" stroke="#8CC4B4" stroke-width="1.8"/>
  <rect x="418" y="88" width="368" height="30" rx="9" fill="#2E6359"/>
  <text x="602" y="108" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="800">2. MARK-UP (GP ON COST %)</text>
  <text x="602" y="144" text-anchor="middle" fill="#9DD9CB" font-family="system-ui, sans-serif" font-size="15" font-weight="800">(Gross Profit ÷ Cost of Sales) × 100</text>
  <text x="602" y="170" text-anchor="middle" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11">% added ON TOP of cost to set selling price</text>
  <text x="602" y="192" text-anchor="middle" fill="#F5A352" font-family="monospace" font-size="10">Margin denominator = Sales · Mark-up = Cost!</text>
  <text x="602" y="210" text-anchor="middle" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10">Example: 25% Mark-Up = 20% Margin</text>

  <!-- Card 3: Net Profit Margin -->
  <rect x="34" y="242" width="368" height="144" rx="10" fill="#122440" stroke="#F5A352" stroke-width="1.8"/>
  <rect x="34" y="242" width="368" height="30" rx="9" fill="#C84E24"/>
  <text x="218" y="262" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="800">3. NET PROFIT MARGIN (NP %)</text>
  <text x="218" y="298" text-anchor="middle" fill="#F5A352" font-family="system-ui, sans-serif" font-size="15" font-weight="800">(Net Profit ÷ Net Sales) × 100</text>
  <text x="218" y="324" text-anchor="middle" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11">Final cents of bottom-line profit per $1 of Sales</text>
  <text x="218" y="346" text-anchor="middle" fill="#FDEFDF" font-family="monospace" font-size="10">Tests: Control over ALL operating expenses!</text>
  <text x="218" y="368" text-anchor="middle" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10">Big gap (GP % − NP %) = high overhead costs</text>

  <!-- Card 4: Rate of Inventory / Stock Turnover -->
  <rect x="418" y="242" width="368" height="144" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="418" y="242" width="368" height="30" rx="9" fill="#1E4D6B"/>
  <text x="602" y="262" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="800">4. RATE OF STOCK TURNOVER</text>
  <text x="602" y="298" text-anchor="middle" fill="#6BC4B0" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Cost of Goods Sold ÷ Average Stock</text>
  <text x="602" y="324" text-anchor="middle" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="10.5">where Average Stock = (Opening Stock + Closing Stock) ÷ 2</text>
  <text x="602" y="346" text-anchor="middle" fill="#F5A352" font-family="monospace" font-size="10">Answer unit: “times per year” (e.g. 6.5 times)!</text>
  <text x="602" y="368" text-anchor="middle" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10">Faster turnover = fresher stock &amp; faster cash flow</text>
</svg>
