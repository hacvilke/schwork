<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" fill="none" role="img" aria-label="Financial Position and Return Ratios: Current Ratio, Acid-Test Ratio, and Return on Investment">
  <rect width="820" height="420" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="392" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Financial Position Ratios: Liquidity &amp; Return on Investment</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">CAN WE PAY SHORT-TERM DEBTS ON TIME — AND IS OWNER’S CAPITAL EARNING A FAIR RETURN?</text>

  <!-- Card 1: Current Ratio -->
  <rect x="34" y="90" width="238" height="240" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="34" y="90" width="238" height="36" rx="9" fill="#4E8577"/>
  <text x="153" y="113" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">1. Current Ratio</text>

  <text x="153" y="148" text-anchor="middle" fill="#6BC4B0" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Current Assets</text>
  <line x1="76" y1="158" x2="230" y2="158" stroke="#6BC4B0" stroke-width="1.8"/>
  <text x="153" y="176" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Current Liabilities</text>

  <rect x="52" y="196" width="202" height="34" rx="7" fill="#132F34" stroke="#6BC4B0"/>
  <text x="153" y="218" text-anchor="middle" fill="#6BC4B0" font-family="monospace" font-size="12" font-weight="800">Benchmark: 1.5 : 1 – 2 : 1</text>

  <text x="48" y="254" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="10.5">• Format: always express as</text>
  <text x="58" y="270" fill="#FFFFFF" font-family="monospace" font-size="10.5" font-weight="700">X.XX : 1</text>
  <text x="48" y="290" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10">• Below 1:1 = liquidity crunch!</text>
  <text x="48" y="308" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10">• Over 4:1 = idle cash/stock!</text>

  <!-- Card 2: Acid Test (Quick) Ratio -->
  <rect x="291" y="90" width="238" height="240" rx="10" fill="#122440" stroke="#F5A352" stroke-width="1.8"/>
  <rect x="291" y="90" width="238" height="36" rx="9" fill="#C84E24"/>
  <text x="410" y="113" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">2. Acid-Test (Quick)</text>

  <text x="410" y="146" text-anchor="middle" fill="#F5A352" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Current Assets − Stock</text>
  <line x1="322" y1="158" x2="498" y2="158" stroke="#F5A352" stroke-width="1.8"/>
  <text x="410" y="176" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Current Liabilities</text>

  <rect x="309" y="196" width="202" height="34" rx="7" fill="#2A1D24" stroke="#F5A352"/>
  <text x="410" y="218" text-anchor="middle" fill="#F5A352" font-family="monospace" font-size="12" font-weight="800">Benchmark: 1 : 1</text>

  <text x="305" y="254" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="10.5">• Excludes Closing Inventory</text>
  <text x="315" y="270" fill="#FDEFDF" font-family="system-ui, sans-serif" font-size="10">(and Prepayments) — slowest</text>
  <text x="315" y="284" fill="#FDEFDF" font-family="system-ui, sans-serif" font-size="10">to convert into urgent cash!</text>
  <text x="305" y="308" fill="#F5A352" font-family="system-ui, sans-serif" font-size="10">• Stricter immediate bill test</text>

  <!-- Card 3: Return on Investment (ROI / ROCE) -->
  <rect x="548" y="90" width="238" height="240" rx="10" fill="#122440" stroke="#8CC4B4" stroke-width="1.8"/>
  <rect x="548" y="90" width="238" height="36" rx="9" fill="#2E6359"/>
  <text x="667" y="113" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">3. Return on Investment</text>

  <text x="667" y="148" text-anchor="middle" fill="#9DD9CB" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Net Profit</text>
  <line x1="582" y1="158" x2="752" y2="158" stroke="#9DD9CB" stroke-width="1.8"/>
  <text x="667" y="176" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Capital Invested × 100</text>

  <rect x="566" y="196" width="202" height="34" rx="7" fill="#1B365D" stroke="#9DD9CB"/>
  <text x="667" y="218" text-anchor="middle" fill="#9DD9CB" font-family="monospace" font-size="11.5" font-weight="800">Compare vs. Bank Rate!</text>

  <text x="562" y="254" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="10.5">• Measures profit earned per</text>
  <text x="572" y="270" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10.5">$100 of owner’s capital</text>
  <text x="562" y="290" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10">• Should comfortably beat</text>
  <text x="562" y="308" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10">  safe bank deposit interest %!</text>

  <!-- Bottom Exam Warning -->
  <rect x="34" y="346" width="752" height="44" rx="9" fill="#122440" stroke="#F5A352" stroke-width="1.3"/>
  <text x="410" y="373" text-anchor="middle" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="11.5"><tspan fill="#F5A352" font-weight="800">UNIT DISCIPLINE:</tspan> Current &amp; Acid-Test = <tspan fill="#6BC4B0" font-weight="700">Ratio (e.g. 1.8 : 1)</tspan>  ·  ROI &amp; Profit Margins = <tspan fill="#9DD9CB" font-weight="700">Percentage (%)</tspan>  ·  Stock Turnover = <tspan fill="#F5A352" font-weight="700">Times</tspan>!</text>
</svg>
