<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-label="Comparison chart of Straight-Line vs Reducing-Balance depreciation over 4 years on a $20,000 van">
  <defs>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #1B365D; }
      .sub { font: 500 13px system-ui, -apple-system, sans-serif; fill: #4A5560; }
      .hdr { font: 700 14.5px system-ui, -apple-system, sans-serif; fill: #FCFBF8; }
      .h3 { font: 700 13px system-ui, -apple-system, sans-serif; fill: #1B365D; }
      .body { font: 500 12px system-ui, -apple-system, sans-serif; fill: #222222; }
      .lbl { font: 700 11.5px system-ui, -apple-system, sans-serif; fill: #FCFBF8; }
      .sage { font: 700 12.5px system-ui, -apple-system, sans-serif; fill: #2E6359; }
      .coral { font: 700 12.5px system-ui, -apple-system, sans-serif; fill: #C84E24; }
    </style>
  </defs>

  <rect width="920" height="470" rx="14" fill="#F8F6F1" stroke="#CEDCD6" stroke-width="1.5"/>
  <text x="32" y="38" class="title">Straight-Line vs. Reducing-Balance Depreciation ($20,000 Delivery Van)</text>
  <text x="32" y="58" class="sub">Compare annual depreciation expense over 4 years: Straight-Line (20% on Cost = $4,000/yr) vs. Reducing-Balance (25% on NBV).</text>

  <!-- Left Panel: Straight-Line -->
  <rect x="32" y="78" width="416" height="310" rx="11" fill="#FCFBF8" stroke="#1B365D" stroke-width="1.6"/>
  <rect x="32" y="78" width="416" height="36" rx="10" fill="#1B365D"/>
  <text x="240" y="101" text-anchor="middle" class="hdr">Straight-Line Method (Equal Charge Every Year)</text>
  <text x="52" y="134" class="h3">Formula: (Cost − Scrap Value) ÷ Useful Life  OR  % × Cost</text>
  <text x="52" y="152" class="body">Example: 20% × $20,000 Original Cost = $4,000 EVERY year</text>

  <!-- Bar Chart Left -->
  <line x1="64" y1="316" x2="416" y2="316" stroke="#4A5560" stroke-width="1.4"/>
  <!-- 4 Equal Bars height 120px = $4000 -->
  <rect x="86" y="196" width="58" height="120" rx="5" fill="#4E8577"/>
  <text x="115" y="188" text-anchor="middle" class="sage">$4,000</text>
  <text x="115" y="334" text-anchor="middle" class="h3">Yr 1</text>

  <rect x="172" y="196" width="58" height="120" rx="5" fill="#4E8577"/>
  <text x="201" y="188" text-anchor="middle" class="sage">$4,000</text>
  <text x="201" y="334" text-anchor="middle" class="h3">Yr 2</text>

  <rect x="258" y="196" width="58" height="120" rx="5" fill="#4E8577"/>
  <text x="287" y="188" text-anchor="middle" class="sage">$4,000</text>
  <text x="287" y="334" text-anchor="middle" class="h3">Yr 3</text>

  <rect x="344" y="196" width="58" height="120" rx="5" fill="#4E8577"/>
  <text x="373" y="188" text-anchor="middle" class="sage">$4,000</text>
  <text x="373" y="334" text-anchor="middle" class="h3">Yr 4</text>

  <text x="240" y="362" text-anchor="middle" class="body">NBV drops steadily: $16,000 → $12,000 → $8,000 → $4,000</text>
  <text x="240" y="378" text-anchor="middle" class="sage">Best for: Buildings, Office Furniture, Fixtures (even wear)</text>

  <!-- Right Panel: Reducing-Balance -->
  <rect x="472" y="78" width="416" height="310" rx="11" fill="#FCFBF8" stroke="#C84E24" stroke-width="1.6"/>
  <rect x="472" y="78" width="416" height="36" rx="10" fill="#C84E24"/>
  <text x="680" y="101" text-anchor="middle" class="hdr">Reducing-Balance Method (Higher Charge Early)</text>
  <text x="492" y="134" class="h3">Formula: Rate % × Net Book Value (Cost − Accum. Depr.)</text>
  <text x="492" y="152" class="body">Example: 25% on NBV → Charge shrinks each year!</text>

  <!-- Bar Chart Right -->
  <line x1="504" y1="316" x2="856" y2="316" stroke="#4A5560" stroke-width="1.4"/>
  <!-- Yr1: $5000 (145px), Yr2: $3750 (109px), Yr3: $2813 (82px), Yr4: $2109 (61px) -->
  <rect x="526" y="176" width="58" height="140" rx="5" fill="#C84E24"/>
  <text x="555" y="169" text-anchor="middle" class="coral">$5,000</text>
  <text x="555" y="334" text-anchor="middle" class="h3">Yr 1</text>

  <rect x="612" y="211" width="58" height="105" rx="5" fill="#D96B38"/>
  <text x="641" y="204" text-anchor="middle" class="coral">$3,750</text>
  <text x="641" y="334" text-anchor="middle" class="h3">Yr 2</text>

  <rect x="698" y="237" width="58" height="79" rx="5" fill="#E88746"/>
  <text x="727" y="230" text-anchor="middle" class="coral">$2,813</text>
  <text x="727" y="334" text-anchor="middle" class="h3">Yr 3</text>

  <rect x="784" y="257" width="58" height="59" rx="5" fill="#F5A352"/>
  <text x="813" y="250" text-anchor="middle" class="coral">$2,109</text>
  <text x="813" y="334" text-anchor="middle" class="h3">Yr 4</text>

  <text x="680" y="362" text-anchor="middle" class="body">NBV drops curving down: $15,000 → $11,250 → $8,437 → $6,328</text>
  <text x="680" y="378" text-anchor="middle" class="coral">Best for: Vehicles, Computers, Machinery (heavy early loss)</text>

  <!-- Bottom Consistency Note -->
  <rect x="32" y="404" width="856" height="46" rx="9" fill="#EBF2EF" stroke="#4E8577" stroke-width="1.3"/>
  <text x="460" y="424" text-anchor="middle" class="h3">Consistency Concept &amp; Non-Cash Reminder</text>
  <text x="460" y="441" text-anchor="middle" class="body">Depreciation is a NON-CASH expense (spreads asset cost over useful life) — once chosen, keep the SAME method every year!</text>
</svg>
