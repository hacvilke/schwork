<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" role="img" aria-label="Visual comparison of the three methods of sharing partnership residual profit: Equal Split, Fixed Ratio, and Capital Ratio">
  <defs>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #1B365D; }
      .sub { font: 500 13px system-ui, -apple-system, sans-serif; fill: #4A5560; }
      .hdr { font: 700 14px system-ui, -apple-system, sans-serif; fill: #FCFBF8; }
      .h3 { font: 700 13px system-ui, -apple-system, sans-serif; fill: #1B365D; }
      .body { font: 500 12px system-ui, -apple-system, sans-serif; fill: #222222; }
      .lbl { font: 700 12px system-ui, -apple-system, sans-serif; fill: #FCFBF8; }
      .sage { font: 700 12.5px system-ui, -apple-system, sans-serif; fill: #2E6359; }
      .coral { font: 700 12.5px system-ui, -apple-system, sans-serif; fill: #C84E24; }
    </style>
  </defs>

  <rect width="920" height="450" rx="14" fill="#F8F6F1" stroke="#CEDCD6" stroke-width="1.5"/>
  <text x="32" y="38" class="title">Three Methods of Sharing Residual Profit ($36,000 Profit Pool)</text>
  <text x="32" y="58" class="sub">Example: Partners Maya (Capital $60,000), Devon (Capital $40,000), and Priya (Capital $20,000) share $36,000 Residual Profit.</text>

  <!-- Method 1: Equal -->
  <rect x="32" y="82" width="272" height="284" rx="11" fill="#FCFBF8" stroke="#1B365D" stroke-width="1.7"/>
  <rect x="32" y="82" width="272" height="36" rx="10" fill="#1B365D"/>
  <text x="168" y="105" text-anchor="middle" class="hdr">1. Equal Split (1 : 1 : 1)</text>
  <text x="48" y="138" class="body">Formula: Residual Profit ÷ 3 partners</text>
  <text x="48" y="156" class="h3">Default under Partnership Act!</text>
  <!-- Stacked Bar -->
  <rect x="48" y="176" width="80" height="34" rx="4" fill="#1B365D"/>
  <text x="88" y="197" text-anchor="middle" class="lbl">1/3</text>
  <rect x="130" y="176" width="80" height="34" rx="4" fill="#4E8577"/>
  <text x="170" y="197" text-anchor="middle" class="lbl">1/3</text>
  <rect x="212" y="176" width="76" height="34" rx="4" fill="#C84E24"/>
  <text x="250" y="197" text-anchor="middle" class="lbl">1/3</text>

  <text x="48" y="236" class="body">• Maya:  1/3 × $36,000 = $12,000</text>
  <text x="48" y="258" class="body">• Devon: 1/3 × $36,000 = $12,000</text>
  <text x="48" y="280" class="body">• Priya: 1/3 × $36,000 = $12,000</text>
  <rect x="48" y="302" width="240" height="46" rx="6" fill="#EBF2EF"/>
  <text x="168" y="321" text-anchor="middle" class="sage">Total Check: $36,000 ✓</text>
  <text x="168" y="338" text-anchor="middle" class="body">Simple — ignores capital gaps</text>

  <!-- Method 2: Fixed Agreed Ratio -->
  <rect x="324" y="82" width="272" height="284" rx="11" fill="#FCFBF8" stroke="#2E6359" stroke-width="1.7"/>
  <rect x="324" y="82" width="272" height="36" rx="10" fill="#2E6359"/>
  <text x="460" y="105" text-anchor="middle" class="hdr">2. Fixed Ratio (e.g. 5 : 3 : 1)</text>
  <text x="340" y="138" class="body">Total Parts = 5 + 3 + 1 = 9 parts</text>
  <text x="340" y="156" class="sage">Custom split in Partnership Deed!</text>
  <!-- Bar 5:3:1 of 240px = 133, 80, 27 -->
  <rect x="340" y="176" width="132" height="34" rx="4" fill="#1B365D"/>
  <text x="406" y="197" text-anchor="middle" class="lbl">5/9</text>
  <rect x="474" y="176" width="78" height="34" rx="4" fill="#4E8577"/>
  <text x="513" y="197" text-anchor="middle" class="lbl">3/9</text>
  <rect x="554" y="176" width="26" height="34" rx="4" fill="#C84E24"/>
  <text x="567" y="197" text-anchor="middle" style="font:700 10px system-ui; fill:#FCFBF8;">1/9</text>

  <text x="340" y="236" class="body">• Maya:  5/9 × $36,000 = $20,000</text>
  <text x="340" y="258" class="body">• Devon: 3/9 × $36,000 = $12,000</text>
  <text x="340" y="280" class="body">• Priya: 1/9 × $36,000 =  $4,000</text>
  <rect x="340" y="302" width="240" height="46" rx="6" fill="#EBF2EF"/>
  <text x="460" y="321" text-anchor="middle" class="sage">Total Check: $36,000 ✓</text>
  <text x="460" y="338" text-anchor="middle" class="body">Rewards seniority / effort</text>

  <!-- Method 3: Capital Ratio -->
  <rect x="616" y="82" width="272" height="284" rx="11" fill="#FCFBF8" stroke="#C84E24" stroke-width="1.7"/>
  <rect x="616" y="82" width="272" height="36" rx="10" fill="#C84E24"/>
  <text x="752" y="105" text-anchor="middle" class="hdr">3. Capital Ratio ($60k:$40k:$20k)</text>
  <text x="632" y="138" class="body">Simplify $60k : $40k : $20k → 3 : 2 : 1</text>
  <text x="632" y="156" class="coral">Total Capital = $120,000 (6 parts)</text>
  <!-- Bar 3:2:1 of 240px = 120, 80, 40 -->
  <rect x="632" y="176" width="118" height="34" rx="4" fill="#1B365D"/>
  <text x="691" y="197" text-anchor="middle" class="lbl">3/6</text>
  <rect x="752" y="176" width="78" height="34" rx="4" fill="#4E8577"/>
  <text x="791" y="197" text-anchor="middle" class="lbl">2/6</text>
  <rect x="832" y="176" width="40" height="34" rx="4" fill="#C84E24"/>
  <text x="852" y="197" text-anchor="middle" class="lbl">1/6</text>

  <text x="632" y="236" class="body">• Maya:  3/6 × $36,000 = $18,000</text>
  <text x="632" y="258" class="body">• Devon: 2/6 × $36,000 = $12,000</text>
  <text x="632" y="280" class="body">• Priya: 1/6 × $36,000 =  $6,000</text>
  <rect x="632" y="302" width="240" height="46" rx="6" fill="#FFF3EE"/>
  <text x="752" y="321" text-anchor="middle" class="coral">Total Check: $36,000 ✓</text>
  <text x="752" y="338" text-anchor="middle" class="body">Strictly proportional to Capital</text>

  <!-- Bottom Residual Rule -->
  <rect x="32" y="384" width="856" height="48" rx="9" fill="#1B365D"/>
  <text x="460" y="405" text-anchor="middle" class="hdr">Watch Out: Ratios Apply to RESIDUAL Profit (or Residual Loss!) — AFTER Salaries &amp; Interest!</text>
  <text x="460" y="424" text-anchor="middle" style="font: 500 12px system-ui; fill: #EBF2EF;">If Interest on Capital + Salaries exceed Net Profit, the resulting NEGATIVE Residual Loss is ALSO split using the exact same ratio!</text>
</svg>
