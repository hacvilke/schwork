<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="920" height="490" role="img" aria-label="Principles of Accounts Final Capstone Project 4-Phase Roadmap uniting all 11 syllabus sections into one complete real-world business accounting portfolio">
  <defs>
