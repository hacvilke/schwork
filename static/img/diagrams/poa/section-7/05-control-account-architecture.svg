<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" role="img" aria-label="Architecture showing how Books of Original Entry feed BOTH Individual Personal Ledgers and Total Control Accounts independently to catch errors">
  <defs>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #1B365D; }
      .sub { font: 500 13px system-ui, -apple-system, sans-serif; fill: #4A5560; }
      .hdr { font: 700 14px system-ui, -apple-system, sans-serif; fill: #FCFBF8; }
      .h3 { font: 700 13px system-ui, -apple-system, sans-serif; fill: #1B365D; }
      .body { font: 500 12px system-ui, -apple-system, sans-serif; fill: #222222; }
      .sage { font: 700 12.5px system-ui, -apple-system, sans-serif; fill: #2E6359; }
      .coral { font: 700 12.5px system-ui, -apple-system, sans-serif; fill: #C84E24; }
    </style>
  </defs>

  <rect width="920" height="450" rx="14" fill="#F8F6F1" stroke="#CEDCD6" stroke-width="1.5"/>
  <text x="32" y="38" class="title">How Control Accounts Work as an Independent Internal Check</text>
  <text x="32" y="58" class="sub">Control Accounts are built from TOTALS of Books of Original Entry (NOT copied from individual customer/supplier accounts!)</text>

  <!-- Left: Books of Original Entry -->
  <rect x="32" y="84" width="248" height="270" rx="11" fill="#FCFBF8" stroke="#1B365D" stroke-width="1.8"/>
  <rect x="32" y="84" width="248" height="36" rx="10" fill="#1B365D"/>
  <text x="156" y="107" text-anchor="middle" class="hdr">Books of Original Entry</text>
  <text x="48" y="144" class="h3">Source Totals &amp; Entries:</text>
  <text x="48" y="168" class="body">• Sales Journal (Credit Sales)</text>
  <text x="48" y="190" class="body">• Purchases Journal (Cr Purch.)</text>
  <text x="48" y="212" class="body">• Returns Inwards / Outwards</text>
  <text x="48" y="234" class="body">• Cash Book (Receipts/Payments,</text>
  <text x="58" y="250" class="body">Discounts, Dishonored Chq)</text>
  <text x="48" y="272" class="body">• General Journal (Bad Debts,</text>
  <text x="58" y="288" class="body">Interest, Set-offs / Contras)</text>
  <rect x="46" y="304" width="220" height="36" rx="6" fill="#EBF2EF"/>
  <text x="156" y="326" text-anchor="middle" class="sage">Single Trusted Source!</text>

  <!-- Split Arrows -->
  <line x1="280" y1="168" x2="348" y2="144" stroke="#2E6359" stroke-width="2.5"/>
  <polygon points="342,138 355,142 346,151" fill="#2E6359"/>
  <text x="314" y="138" text-anchor="middle" style="font:700 10.5px system-ui; fill:#2E6359;">TOTALS</text>

  <line x1="280" y1="274" x2="348" y2="296" stroke="#1B365D" stroke-width="2.5"/>
  <polygon points="346,289 355,298 342,302" fill="#1B365D"/>
  <text x="314" y="312" text-anchor="middle" style="font:700 10.5px system-ui; fill:#1B365D;">INDIVIDUAL</text>

  <!-- Middle Top: Control Account (General Ledger) -->
  <rect x="358" y="84" width="276" height="122" rx="11" fill="#FCFBF8" stroke="#2E6359" stroke-width="1.8"/>
  <rect x="358" y="84" width="276" height="34" rx="10" fill="#2E6359"/>
  <text x="496" y="106" text-anchor="middle" class="hdr">Control Accounts (General Ledger)</text>
  <text x="374" y="138" class="h3">Prepared by Senior Accountant</text>
  <text x="374" y="158" class="body">• Sales Ledger Control A/c (SLCA)</text>
  <text x="374" y="176" class="body">• Purchases Ledger Control A/c (PLCA)</text>
  <text x="374" y="194" class="sage">Gives INSTANT Total Debtors / Creditors!</text>

  <!-- Middle Bottom: Subsidiary Personal Ledgers -->
  <rect x="358" y="232" width="276" height="122" rx="11" fill="#FCFBF8" stroke="#4E8577" stroke-width="1.6"/>
  <rect x="358" y="232" width="276" height="34" rx="10" fill="#4E8577"/>
  <text x="496" y="254" text-anchor="middle" class="hdr">Individual Personal Ledgers</text>
  <text x="374" y="286" class="h3">Maintained by Ledger Clerks</text>
  <text x="374" y="306" class="body">• Hundreds of individual Customer A/cs</text>
  <text x="374" y="324" class="body">• Hundreds of individual Supplier A/cs</text>
  <text x="374" y="342" class="body">Summed into List of Balances at month-end</text>

  <!-- Converge Arrows to Check Box -->
  <line x1="634" y1="145" x2="676" y2="205" stroke="#2E6359" stroke-width="2.4"/>
  <line x1="634" y1="292" x2="676" y2="232" stroke="#1B365D" stroke-width="2.4"/>
  <polygon points="670,211 682,218 670,225" fill="#C84E24"/>

  <!-- Right: Independent Check -->
  <rect x="684" y="114" width="204" height="210" rx="11" fill="#FCFBF8" stroke="#C84E24" stroke-width="1.8"/>
  <rect x="684" y="114" width="204" height="36" rx="10" fill="#C84E24"/>
  <text x="786" y="137" text-anchor="middle" class="hdr">Monthly Check!</text>
  <text x="700" y="176" class="h3">SLCA Closing Balance</text>
  <text x="786" y="200" text-anchor="middle" style="font:700 20px system-ui; fill:#2E6359;">MUST =</text>
  <text x="700" y="224" class="h3">Sum of All Individual</text>
  <text x="700" y="242" class="h3">Customer Balances!</text>
  <rect x="698" y="260" width="176" height="50" rx="7" fill="#FFF3EE"/>
  <text x="786" y="281" text-anchor="middle" class="coral">Mismatch? Error PINPOINTED</text>
  <text x="786" y="299" text-anchor="middle" class="body">to one specific ledger fast!</text>

  <!-- Bottom Benefits Strip -->
  <rect x="32" y="376" width="856" height="54" rx="9" fill="#1B365D"/>
  <text x="460" y="399" text-anchor="middle" class="hdr">4 Key Benefits of Control Accounts (Guaranteed Exam Marks!)</text>
  <text x="460" y="419" text-anchor="middle" style="font: 500 12.2px system-ui; fill: #EBF2EF;">1. Locate errors fast  ·  2. Deter staff fraud (segregation of duties)  ·  3. Instant Debtors/Creditors for Final Accounts  ·  4. Faster management credit control</text>
</svg>
