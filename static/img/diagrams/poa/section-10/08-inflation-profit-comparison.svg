<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="Comparison Chart of FIFO, AVCO, and LIFO Impact on Closing Inventory, Cost of Goods Sold, and Gross Profit During Rising Prices">
  <defs>
    <style>
      .bg { fill: #F8F6F1; }
      .card { fill: #FCFBF8; stroke: #CEDCD6; stroke-width: 2; rx: 12; }
      .navy { fill: #1B365D; rx: 8; }
      .sage { fill: #2E6359; rx: 8; }
      .coral { fill: #C84E24; rx: 8; }
      .amber { fill: #F5A352; rx: 6; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 800; fill: #1B365D; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #4A5560; }
      .w-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 800; fill: #FFFFFF; }
      .w-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #EBF2EF; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 800; fill: #1B365D; }
      .body { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #222222; }
      .val { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 800; fill: #FFFFFF; }
      .coral-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 800; fill: #C84E24; }
    </style>
  </defs>

  <rect class="bg" width="920" height="470"/>
  <text x="460" y="34" text-anchor="middle" class="title">How Valuation Methods Shift Profit During Inflation (Rising Prices)</text>
  <text x="460" y="54" text-anchor="middle" class="subtitle">Same 230 units sold for $4,600 Sales (Total Available Cost = $4,200) — watch how FIFO, AVCO, and LIFO shift Gross Profit!</text>

  <!-- Left Visual Bar Chart Card -->
  <rect class="card" x="24" y="74" width="490" height="314"/>
  <text x="269" y="102" text-anchor="middle" class="label">GROSS PROFIT &amp; CLOSING STOCK COMPARISON (INFLATION)</text>

  <!-- FIFO Row -->
  <text x="44" y="140" class="label">FIFO</text>
  <text x="44" y="156" class="body">(Highest Profit!)</text>
  <rect class="navy" x="155" y="122" width="320" height="24"/>
  <text x="465" y="139" text-anchor="end" class="val">Gross Profit: $2,040</text>
  <rect class="sage" x="155" y="150" width="265" height="22"/>
  <text x="410" y="165" text-anchor="end" class="val">Closing Stock: $1,640</text>

  <!-- AVCO Row -->
  <text x="44" y="218" class="label">AVCO</text>
  <text x="44" y="234" class="body">(Balanced Middle)</text>
  <rect class="navy" x="155" y="200" width="286" height="24"/>
  <text x="431" y="217" text-anchor="end" class="val">Gross Profit: $1,840</text>
  <rect class="sage" x="155" y="228" width="232" height="22"/>
  <text x="377" y="243" text-anchor="end" class="val">Closing Stock: $1,440</text>

  <!-- LIFO Row -->
  <text x="44" y="296" class="label">LIFO</text>
  <text x="44" y="312" class="coral-txt">(Lowest Profit!)</text>
  <rect class="coral" x="155" y="278" width="256" height="24"/>
  <text x="401" y="295" text-anchor="end" class="val">Gross Profit: $1,640</text>
  <rect class="amber" x="155" y="306" width="200" height="22"/>
  <text x="345" y="321" text-anchor="end" class="label">Closing Stock: $1,240</text>

  <text x="44" y="366" class="coral-txt">Note: Every $100 HIGHER Closing Stock → $100 LOWER COGS → $100 HIGHER Gross Profit!</text>

  <!-- Right Side Ranking & Consistency Card -->
  <rect class="card" x="534" y="74" width="362" height="314"/>
  <rect class="navy" x="546" y="86" width="338" height="40"/>
  <text x="715" y="111" text-anchor="middle" class="w-title">INFLATION RANKING CHEAT SHEET</text>

  <text x="556" y="152" class="label">When Purchase Prices Are RISING:</text>
  <text x="564" y="176" class="body">• Closing Stock:  FIFO  &gt;  AVCO  &gt;  LIFO</text>
  <text x="564" y="198" class="body">• Cost of Sales:  LIFO  &gt;  AVCO  &gt;  FIFO</text>
  <text x="564" y="220" class="coral-txt">• Gross Profit:   FIFO  &gt;  AVCO  &gt;  LIFO</text>
  <text x="564" y="242" class="body">• Tax Bill:       FIFO  &gt;  AVCO  &gt;  LIFO</text>

  <line x1="556" y1="260" x2="876" y2="260" stroke="#CEDCD6" stroke-width="1.5"/>

  <text x="556" y="284" class="label">When Purchase Prices Are FALLING:</text>
  <text x="564" y="306" class="coral-txt">EVERY SINGLE RANKING FLIPS EXACTLY!</text>
  <text x="564" y="328" class="body">• Gross Profit:   LIFO  &gt;  AVCO  &gt;  FIFO</text>
  <text x="564" y="352" class="body">• Closing Stock:  LIFO  &gt;  AVCO  &gt;  FIFO</text>
  <text x="564" y="374" class="label">AVCO ALWAYS stays safely in the middle!</text>

  <!-- Bottom Consistency Banner -->
  <rect class="sage" x="24" y="404" width="872" height="50"/>
  <text x="460" y="425" text-anchor="middle" class="w-title">CONSISTENCY CONCEPT: NEVER FLIP-FLOP METHODS YEAR-TO-YEAR TO MANIPULATE PROFIT!</text>
  <text x="460" y="443" text-anchor="middle" class="w-sub">Once chosen, use the same valuation method consistently so investors can compare Year 1 vs. Year 2 profits honestly!</text>
</svg>
