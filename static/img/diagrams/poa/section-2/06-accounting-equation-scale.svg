<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" fill="none" role="img" aria-label="The Accounting Equation Balance Scale: Assets Equal Capital Plus Liabilities">
  <rect width="820" height="420" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="392" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">The Accounting Equation: Always in Perfect Balance</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">RESOURCES OWNED BY THE BUSINESS  =  CLAIMS OF OWNER + CLAIMS OF OUTSIDERS</text>

  <!-- Main Equation Banner -->
  <rect x="64" y="88" width="692" height="58" rx="10" fill="#122440" stroke="#F5A352" stroke-width="2"/>
  <text x="205" y="124" text-anchor="middle" fill="#6BC4B0" font-family="system-ui, sans-serif" font-size="22" font-weight="800">ASSETS</text>
  <text x="325" y="124" text-anchor="middle" fill="#F5A352" font-family="system-ui, sans-serif" font-size="24" font-weight="800">=</text>
  <text x="455" y="124" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800">CAPITAL</text>
  <text x="556" y="124" text-anchor="middle" fill="#F5A352" font-family="system-ui, sans-serif" font-size="24" font-weight="800">+</text>
  <text x="665" y="124" text-anchor="middle" fill="#F5A352" font-family="system-ui, sans-serif" font-size="22" font-weight="800">LIABILITIES</text>

  <!-- Balance Scale Visual -->
  <!-- Beam -->
  <line x1="130" y1="212" x2="690" y2="212" stroke="#F5A352" stroke-width="4" stroke-linecap="round"/>
  <!-- Fulcrum -->
  <polygon points="410,214 388,256 432,256" fill="#F5A352"/>
  <rect x="358" y="256" width="104" height="12" rx="6" fill="#4E8577"/>
  <text x="410" y="246" text-anchor="middle" fill="#122440" font-family="monospace" font-size="13" font-weight="800">=</text>

  <!-- Left Pan (Assets) -->
  <line x1="190" y1="212" x2="190" y2="232" stroke="#6BC4B0" stroke-width="2.2"/>
  <rect x="52" y="232" width="276" height="96" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <text x="190" y="254" text-anchor="middle" fill="#6BC4B0" font-family="monospace" font-size="11.5" font-weight="700">WHAT THE BUSINESS OWNS</text>
  <text x="68" y="276" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11.5">• Cash, Bank, Inventory, Receivables</text>
  <text x="68" y="294" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11.5">• Premises, Vehicles, Equipment</text>
  <text x="68" y="314" fill="#9DD9CB" font-family="monospace" font-size="10.5">Example total: $100,000</text>

  <!-- Right Pan (Capital + Liabilities) -->
  <line x1="630" y1="212" x2="630" y2="232" stroke="#F5A352" stroke-width="2.2"/>
  <rect x="492" y="232" width="276" height="96" rx="10" fill="#122440" stroke="#F5A352" stroke-width="1.8"/>
  <text x="630" y="254" text-anchor="middle" fill="#F5A352" font-family="monospace" font-size="11.5" font-weight="700">WHO FINANCED THOSE ASSETS</text>
  <text x="508" y="276" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11.5">• Capital (Owner’s stake): $65,000</text>
  <text x="508" y="294" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11.5">• Liabilities (Loans, Payables): $35,000</text>
  <text x="508" y="314" fill="#F5A352" font-family="monospace" font-size="10.5">Example total: $65,000 + $35,000 = $100,000</text>

  <!-- Three Rearrangements strip -->
  <rect x="34" y="346" width="240" height="44" rx="8" fill="#122440" stroke="#4E8577" stroke-width="1.4"/>
  <text x="154" y="365" text-anchor="middle" fill="#9DD9CB" font-family="monospace" font-size="10" font-weight="700">FIND ASSETS</text>
  <text x="154" y="382" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">A = C + L</text>

  <rect x="290" y="346" width="240" height="44" rx="8" fill="#122440" stroke="#4E8577" stroke-width="1.4"/>
  <text x="410" y="365" text-anchor="middle" fill="#9DD9CB" font-family="monospace" font-size="10" font-weight="700">FIND CAPITAL (NET WORTH)</text>
  <text x="410" y="382" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">C = A − L</text>

  <rect x="546" y="346" width="240" height="44" rx="8" fill="#122440" stroke="#4E8577" stroke-width="1.4"/>
  <text x="666" y="365" text-anchor="middle" fill="#9DD9CB" font-family="monospace" font-size="10" font-weight="700">FIND LIABILITIES</text>
  <text x="666" y="382" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">L = A − C</text>
</svg>
