<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" fill="none" role="img" aria-label="How the Three Main Financial Statements Connect">
  <rect width="820" height="420" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="392" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">The Three Core Financial Statements &amp; How They Connect</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">PERFORMANCE (MOVIE)  +  POSITION (SNAPSHOT)  +  LIQUIDITY (CASH PULSE)</text>

  <!-- Statement 1: Income Statement -->
  <rect x="34" y="92" width="234" height="218" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="34" y="92" width="234" height="38" rx="10" fill="#4E8577"/>
  <text x="151" y="110" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">1. Income Statement</text>
  <text x="151" y="124" text-anchor="middle" fill="#EBF2EF" font-family="monospace" font-size="9.5">FOR THE YEAR ENDED ...</text>

  <text x="48" y="152" fill="#9DD9CB" font-family="monospace" font-size="10" font-weight="700">ANSWERS: DID WE EARN PROFIT?</text>
  <text x="48" y="176" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11.5">• Sales Revenue</text>
  <text x="48" y="196" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11.5">− Cost of Goods Sold = Gross Profit</text>
  <text x="48" y="216" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11.5">+ Other Income</text>
  <text x="48" y="236" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11.5">− Operating Expenses</text>
  <rect x="48" y="254" width="206" height="38" rx="7" fill="#1B365D" stroke="#6BC4B0" stroke-width="1.3"/>
  <text x="151" y="272" text-anchor="middle" fill="#6BC4B0" font-family="system-ui, sans-serif" font-size="12" font-weight="800">= NET PROFIT / (LOSS)</text>
  <text x="151" y="286" text-anchor="middle" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="9.5">Flows into Capital on Balance Sheet</text>

  <!-- Arrow 1->2 -->
  <path d="M272 272 H292" stroke="#F5A352" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M286 266 L295 272 L286 278" fill="none" stroke="#F5A352" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Statement 2: Balance Sheet -->
  <rect x="296" y="92" width="234" height="218" rx="10" fill="#122440" stroke="#F5A352" stroke-width="1.8"/>
  <rect x="296" y="92" width="234" height="38" rx="10" fill="#C84E24"/>
  <text x="413" y="110" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">2. Balance Sheet</text>
  <text x="413" y="124" text-anchor="middle" fill="#FDEFDF" font-family="monospace" font-size="9.5">AS AT [ONE SPECIFIC DATE]</text>

  <text x="310" y="152" fill="#F5A352" font-family="monospace" font-size="10" font-weight="700">ANSWERS: WHAT IS OUR WORTH?</text>
  <text x="310" y="176" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11.5">• Non-Current &amp; Current Assets</text>
  <text x="310" y="196" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11.5">• Current &amp; Non-Current Liabilities</text>
  <text x="310" y="216" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11.5">• Owner’s Equity (Capital</text>
  <text x="310" y="232" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11.5">  + Net Profit − Drawings)</text>
  <rect x="310" y="254" width="206" height="38" rx="7" fill="#1B365D" stroke="#F5A352" stroke-width="1.3"/>
  <text x="413" y="272" text-anchor="middle" fill="#F5A352" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">ASSETS = CAPITAL + LIABILITIES</text>
  <text x="413" y="286" text-anchor="middle" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="9.5">Closing Cash ties to Cash Flow</text>

  <!-- Arrow 3->2 -->
  <path d="M554 272 H534" stroke="#6BC4B0" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M540 266 L531 272 L540 278" fill="none" stroke="#6BC4B0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Statement 3: Cash Flow Statement -->
  <rect x="558" y="92" width="228" height="218" rx="10" fill="#122440" stroke="#8CC4B4" stroke-width="1.8"/>
  <rect x="558" y="92" width="228" height="38" rx="10" fill="#2E6359"/>
  <text x="672" y="110" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">3. Cash Flow Statement</text>
  <text x="672" y="124" text-anchor="middle" fill="#EBF2EF" font-family="monospace" font-size="9.5">FOR THE YEAR ENDED ...</text>

  <text x="572" y="152" fill="#9DD9CB" font-family="monospace" font-size="10" font-weight="700">ANSWERS: WHERE DID CASH GO?</text>
  <text x="572" y="176" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11.5">• Operating Cash Flows</text>
  <text x="572" y="196" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11.5">• Investing Cash Flows</text>
  <text x="572" y="216" fill="#DCE8F2" font-family="system-ui, sans-serif" font-size="11.5">• Financing Cash Flows</text>
  <text x="572" y="236" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="10.5">(Tracks actual cash in &amp; out)</text>
  <rect x="572" y="254" width="200" height="38" rx="7" fill="#1B365D" stroke="#8CC4B4" stroke-width="1.3"/>
  <text x="672" y="272" text-anchor="middle" fill="#9DD9CB" font-family="system-ui, sans-serif" font-size="12" font-weight="800">= CLOSING CASH BALANCE</text>
  <text x="672" y="286" text-anchor="middle" fill="#A5C0D6" font-family="system-ui, sans-serif" font-size="9.5">Matches Cash on Balance Sheet</text>

  <!-- Key takeaway strip -->
  <rect x="34" y="330" width="752" height="60" rx="9" fill="#122440" stroke="#4E8577" stroke-width="1.3"/>
  <text x="52" y="354" fill="#F5A352" font-family="monospace" font-size="11" font-weight="700">EXAM MEMORY HOOK — PERIOD VS. POINT IN TIME:</text>
  <text x="52" y="376" fill="#F4F7FA" font-family="system-ui, sans-serif" font-size="12">Income Statement &amp; Cash Flow cover a <tspan fill="#6BC4B0" font-weight="700">period ("For the year ended ...")</tspan> · Balance Sheet is a <tspan fill="#F5A352" font-weight="700">snapshot ("As at 31 Dec ...")</tspan>.</text>
</svg>
