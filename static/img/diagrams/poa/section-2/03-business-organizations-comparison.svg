<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" fill="none" role="img" aria-label="Accounting Features Comparison of Sole Traders, Partnerships, and Corporations">
  <rect width="820" height="430" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="402" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Business Structures: Key Accounting Features Compared</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">HOW OWNERSHIP CHANGES CAPITAL ACCOUNTS, PROFIT SHARING &amp; LIABILITY</text>

  <!-- Column 1: Sole Trader -->
  <rect x="34" y="88" width="238" height="308" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="34" y="88" width="238" height="44" rx="10" fill="#4E8577"/>
  <text x="153" y="108" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Sole Trader</text>
  <text x="153" y="124" text-anchor="middle" fill="#EBF2EF" font-family="monospace" font-size="10">1 OWNER · SIMPLEST</text>

  <g font-family="system-ui, sans-serif">
    <text x="48" y="154" fill="#6BC4B0" font-size="10.5" font-weight="700">EQUITY / CAPITAL</text>
    <text x="48" y="170" fill="#DCE8F2" font-size="11">1 Capital A/c + 1 Drawings A/c</text>

    <line x1="48" y1="184" x2="258" y2="184" stroke="#233E63"/>
    <text x="48" y="202" fill="#6BC4B0" font-size="10.5" font-weight="700">PROFIT DISTRIBUTION</text>
    <text x="48" y="218" fill="#DCE8F2" font-size="11">100% of Net Profit added to</text>
    <text x="48" y="232" fill="#DCE8F2" font-size="11">the single owner’s Capital</text>

    <line x1="48" y1="246" x2="258" y2="246" stroke="#233E63"/>
    <text x="48" y="264" fill="#6BC4B0" font-size="10.5" font-weight="700">LEGAL LIABILITY</text>
    <text x="48" y="280" fill="#F5A352" font-size="11" font-weight="700">Unlimited personal liability</text>

    <line x1="48" y1="294" x2="258" y2="294" stroke="#233E63"/>
    <text x="48" y="312" fill="#6BC4B0" font-size="10.5" font-weight="700">FINANCIAL STATEMENTS</text>
    <text x="48" y="328" fill="#DCE8F2" font-size="11">Income Statement &amp; Balance Sheet</text>
    <text x="48" y="344" fill="#A5C0D6" font-size="10.5">Private — no mandatory audit</text>
    <text x="48" y="376" fill="#9DD9CB" font-size="10.5" font-style="italic">e.g. Local bakery, barber, tutor</text>
  </g>

  <!-- Column 2: Partnership -->
  <rect x="291" y="88" width="238" height="308" rx="10" fill="#122440" stroke="#8CC4B4" stroke-width="1.8"/>
  <rect x="291" y="88" width="238" height="44" rx="10" fill="#2E6359"/>
  <text x="410" y="108" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Partnership</text>
  <text x="410" y="124" text-anchor="middle" fill="#EBF2EF" font-family="monospace" font-size="10">2–20 PARTNERS · DEED</text>

  <g font-family="system-ui, sans-serif">
    <text x="305" y="154" fill="#9DD9CB" font-size="10.5" font-weight="700">EQUITY / CAPITAL</text>
    <text x="305" y="170" fill="#DCE8F2" font-size="11">Separate Capital &amp; Current A/cs</text>

    <line x1="305" y1="184" x2="515" y2="184" stroke="#233E63"/>
    <text x="305" y="202" fill="#9DD9CB" font-size="10.5" font-weight="700">PROFIT DISTRIBUTION</text>
    <text x="305" y="218" fill="#DCE8F2" font-size="11">Appropriation A/c: interest,</text>
    <text x="305" y="232" fill="#DCE8F2" font-size="11">salaries &amp; profit-sharing ratio</text>

    <line x1="305" y1="246" x2="515" y2="246" stroke="#233E63"/>
    <text x="305" y="264" fill="#9DD9CB" font-size="10.5" font-weight="700">LEGAL LIABILITY</text>
    <text x="305" y="280" fill="#F5A352" font-size="11" font-weight="700">Unlimited (ordinary partners)</text>

    <line x1="305" y1="294" x2="515" y2="294" stroke="#233E63"/>
    <text x="305" y="312" fill="#9DD9CB" font-size="10.5" font-weight="700">FINANCIAL STATEMENTS</text>
    <text x="305" y="328" fill="#DCE8F2" font-size="11">Income, Appropriation &amp; Bal. Sheet</text>
    <text x="305" y="344" fill="#A5C0D6" font-size="10.5">Governed by Partnership Deed</text>
    <text x="305" y="376" fill="#9DD9CB" font-size="10.5" font-style="italic">e.g. Law firm, dental clinic</text>
  </g>

  <!-- Column 3: Corporation (Limited Company) -->
  <rect x="548" y="88" width="238" height="308" rx="10" fill="#122440" stroke="#F5A352" stroke-width="1.8"/>
  <rect x="548" y="88" width="238" height="44" rx="10" fill="#C84E24"/>
  <text x="667" y="108" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Corporation (LLC)</text>
  <text x="667" y="124" text-anchor="middle" fill="#FDEFDF" font-family="monospace" font-size="10">SHAREHOLDERS · SEPARATE</text>

  <g font-family="system-ui, sans-serif">
    <text x="562" y="154" fill="#F5A352" font-size="10.5" font-weight="700">EQUITY / CAPITAL</text>
    <text x="562" y="170" fill="#DCE8F2" font-size="11">Share Capital + Retained Earnings</text>

    <line x1="562" y1="184" x2="772" y2="184" stroke="#233E63"/>
    <text x="562" y="202" fill="#F5A352" font-size="10.5" font-weight="700">PROFIT DISTRIBUTION</text>
    <text x="562" y="218" fill="#DCE8F2" font-size="11">Corporate tax, Dividends to</text>
    <text x="562" y="232" fill="#DCE8F2" font-size="11">shareholders &amp; Reserves</text>

    <line x1="562" y1="246" x2="772" y2="246" stroke="#233E63"/>
    <text x="562" y="264" fill="#F5A352" font-size="10.5" font-weight="700">LEGAL LIABILITY</text>
    <text x="562" y="280" fill="#6BC4B0" font-size="11" font-weight="700">Limited to share investment</text>

    <line x1="562" y1="294" x2="772" y2="294" stroke="#233E63"/>
    <text x="562" y="312" fill="#F5A352" font-size="10.5" font-weight="700">FINANCIAL STATEMENTS</text>
    <text x="562" y="328" fill="#DCE8F2" font-size="11">Full statutory set + Cash Flows</text>
    <text x="562" y="344" fill="#A5C0D6" font-size="10.5">Public companies audited by law</text>
    <text x="562" y="376" fill="#F5A352" font-size="10.5" font-style="italic">e.g. Banks, airlines, chains</text>
  </g>
</svg>
