<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" fill="none" role="img" aria-label="Classified Balance Sheet Structure Comparing Order of Permanence and Order of Liquidity">
  <rect width="820" height="430" rx="12" fill="#1B365D"/>
  <rect x="14" y="14" width="792" height="402" rx="10" stroke="#2D507C" stroke-width="1.2"/>

  <!-- Header -->
  <text x="34" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Classified Balance Sheet: Order of Permanence vs. Liquidity</text>
  <text x="34" y="66" fill="#9DD9CB" font-family="monospace" font-size="11.5">SAME NUMBERS &amp; SAME TOTALS — ORDERED EITHER LONGEST-LASTING FIRST OR CASH FIRST</text>

  <!-- Left: Order of Permanence -->
  <rect x="34" y="88" width="360" height="310" rx="10" fill="#122440" stroke="#6BC4B0" stroke-width="1.8"/>
  <rect x="34" y="88" width="360" height="36" rx="10" fill="#4E8577"/>
  <text x="214" y="111" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">Order of Permanence (Most Examined)</text>

  <!-- Downward gradient arrow -->
  <path d="M56 142 V368" stroke="#6BC4B0" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M50 362 L56 371 L62 362" fill="none" stroke="#6BC4B0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="56" y="136" text-anchor="middle" fill="#9DD9CB" font-family="monospace" font-size="8.5" font-weight="700">MOST</text>
  <text x="56" y="384" text-anchor="middle" fill="#9DD9CB" font-family="monospace" font-size="8.5" font-weight="700">LEAST</text>

  <g font-family="system-ui, sans-serif">
    <rect x="76" y="138" width="302" height="72" rx="8" fill="#1B365D" stroke="#6BC4B0" stroke-width="1.3"/>
    <text x="90" y="156" fill="#6BC4B0" font-family="monospace" font-size="10.5" font-weight="700">1. NON-CURRENT (FIXED) ASSETS</text>
    <text x="90" y="174" fill="#DCE8F2" font-size="11">Land &amp; Buildings → Machinery → Fixtures</text>
    <text x="90" y="191" fill="#DCE8F2" font-size="11">→ Motor Vehicles → Office Equipment</text>

    <rect x="76" y="220" width="302" height="72" rx="8" fill="#1B365D" stroke="#8CC4B4" stroke-width="1.3"/>
    <text x="90" y="238" fill="#9DD9CB" font-family="monospace" font-size="10.5" font-weight="700">2. CURRENT ASSETS (Hardest → Easiest Cash)</text>
    <text x="90" y="256" fill="#DCE8F2" font-size="11">Closing Inventory → Trade Receivables</text>
    <text x="90" y="273" fill="#DCE8F2" font-size="11">→ Prepayments → Bank → Cash in Hand</text>

    <rect x="76" y="302" width="302" height="80" rx="8" fill="#1B365D" stroke="#F5A352" stroke-width="1.3"/>
    <text x="90" y="320" fill="#F5A352" font-family="monospace" font-size="10.5" font-weight="700">3. WORKING CAPITAL &amp; FINANCED BY</text>
    <text x="90" y="338" fill="#DCE8F2" font-size="11">Less Current Liabilities = Working Capital</text>
    <text x="90" y="355" fill="#DCE8F2" font-size="11">Financed By: Capital + Net Profit − Drawings</text>
    <text x="90" y="371" fill="#A5C0D6" font-size="10.5">+ Non-Current Liabilities (Long-Term Loan)</text>
  </g>

  <!-- Right: Order of Liquidity -->
  <rect x="426" y="88" width="360" height="310" rx="10" fill="#122440" stroke="#F5A352" stroke-width="1.8"/>
  <rect x="426" y="88" width="360" height="36" rx="10" fill="#C84E24"/>
  <text x="606" y="111" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">Order of Liquidity (Cash First)</text>

  <!-- Downward arrow -->
  <path d="M448 142 V368" stroke="#F5A352" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M442 362 L448 371 L454 362" fill="none" stroke="#F5A352" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="448" y="136" text-anchor="middle" fill="#F5A352" font-family="monospace" font-size="8.5" font-weight="700">CASH</text>
  <text x="448" y="384" text-anchor="middle" fill="#F5A352" font-family="monospace" font-size="8.5" font-weight="700">FIXED</text>

  <g font-family="system-ui, sans-serif">
    <rect x="468" y="138" width="302" height="72" rx="8" fill="#1B365D" stroke="#F5A352" stroke-width="1.3"/>
    <text x="482" y="156" fill="#F5A352" font-family="monospace" font-size="10.5" font-weight="700">1. CURRENT ASSETS (Already Cash First!)</text>
    <text x="482" y="174" fill="#DCE8F2" font-size="11">Cash in Hand → Bank → Prepayments</text>
    <text x="482" y="191" fill="#DCE8F2" font-size="11">→ Trade Receivables → Closing Inventory</text>

    <rect x="468" y="220" width="302" height="72" rx="8" fill="#1B365D" stroke="#F5A352" stroke-width="1.3"/>
    <text x="482" y="238" fill="#F5A352" font-family="monospace" font-size="10.5" font-weight="700">2. NON-CURRENT (FIXED) ASSETS</text>
    <text x="482" y="256" fill="#DCE8F2" font-size="11">Office Equipment → Motor Vehicles</text>
    <text x="482" y="273" fill="#DCE8F2" font-size="11">→ Fixtures → Machinery → Land &amp; Buildings</text>

    <rect x="468" y="302" width="302" height="80" rx="8" fill="#1B365D" stroke="#6BC4B0" stroke-width="1.3"/>
    <text x="482" y="320" fill="#6BC4B0" font-family="monospace" font-size="10.5" font-weight="700">3. LIABILITIES (Due Soonest → Latest)</text>
    <text x="482" y="338" fill="#DCE8F2" font-size="11">Current Liabilities (Overdraft, Payables)</text>
    <text x="482" y="355" fill="#DCE8F2" font-size="11">→ Non-Current Liabilities (Bank Loan)</text>
    <text x="482" y="371" fill="#A5C0D6" font-size="10.5">→ Owner’s Equity (Capital — permanent)</text>
  </g>
</svg>
